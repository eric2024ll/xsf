name: windows-portable

on:
  workflow_dispatch:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 安装依赖
        run: pip install -e ".[desktop,build,office,mcp]"

      - name: FTS5 自检
        run: python -c "import sqlite3, tempfile, os; db = os.path.join(tempfile.mkdtemp(), 't.db'); c = sqlite3.connect(db); c.execute('CREATE VIRTUAL TABLE t USING fts5(x)'); c.close(); print('FTS5 OK')"

      - name: PyInstaller 打包
        run: pyinstaller packaging/xsf.spec --noconfirm

      - name: 便携版冒烟 (frozen office 链路)
        shell: pwsh
        run: |
          python packaging/make_smoke_docx.py smoke.docx
          dist/xsf-portable/xsf.exe add smoke.docx -c _ci_smoke
          $out = dist/xsf-portable/xsf.exe search "冒烟" -c _ci_smoke | Out-String
          if ($out -notmatch '条结果') { throw "frozen office 链路未命中: $out" }

      - name: 便携版 doctor 自检 (frozen 可跑性)
        shell: pwsh
        run: |
          $out = dist/xsf-portable/xsf.exe doctor | Out-String
          if ($LASTEXITCODE -ne 0) { throw "doctor 退出码 $LASTEXITCODE" }
          Write-Host $out

      - name: 组装便携版 zip
        shell: pwsh
        run: pwsh packaging/make_portable.ps1

      - name: 上传 artifact
        uses: actions/upload-artifact@v4
        with:
          name: xsf-portable-win64
          path: dist/*.zip
          if-no-files-found: error

      - name: 附到 release (tag 构建)
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$env:GITHUB_REF_NAME" --repo "$env:GITHUB_REPOSITORY" 2>$null
          if ($LASTEXITCODE -eq 0) {
            gh release upload "$env:GITHUB_REF_NAME" dist/*.zip --clobber --repo "$env:GITHUB_REPOSITORY"
          } else {
            # release 说明 = tag 注释文字 (打 tag 时 -m 写的内容), 不用 --generate-notes 免出完整 changelog
            # 经 GitHub API 取 (actions/checkout 默认 shallow, 本地 git tag 对象注释不可靠; v0.3.0/v0.3.1 由此错成 commit message)
            $objType = gh api "repos/$env:GITHUB_REPOSITORY/git/ref/tags/$env:GITHUB_REF_NAME" --jq '.object.type'
            $notes = ''
            if ($objType -eq 'tag') {
              $tagSha = gh api "repos/$env:GITHUB_REPOSITORY/git/ref/tags/$env:GITHUB_REF_NAME" --jq '.object.sha'
              $notes = gh api "repos/$env:GITHUB_REPOSITORY/git/tags/$tagSha" --jq '.message'
            }
            if (-not $notes.Trim()) { $notes = "$env:GITHUB_REF_NAME" }
            $notes | Out-File -Encoding utf8 release-notes.txt
            gh release create "$env:GITHUB_REF_NAME" dist/*.zip --notes-file release-notes.txt --repo "$env:GITHUB_REPOSITORY"
          }
