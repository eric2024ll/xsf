<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="icon" href="/favicon.ico">
<title>搜索 — 小書房</title>
<link rel="stylesheet" href="/static/app.css">
<style>
.search-bar {
  background: var(--card-bg); padding: 16px 24px; border-bottom: 1px solid var(--border);
  display: flex; gap: 12px; align-items: center;
}
.search-bar input[type="text"] {
  flex: 1; min-width: 200px; padding: 9px 14px; border: 1px solid var(--border);
  border-radius: var(--radius); font-size: 0.95rem;
}
.search-bar button {
  padding: 9px 24px; background: var(--primary); color: white; border: none;
  border-radius: var(--radius); cursor: pointer; font-size: 0.95rem; font-weight: 600;
}
.search-bar button:hover { background: var(--primary-hover); }
.search-bar button:disabled { opacity: 0.5; cursor: not-allowed; }
.main { max-width: 900px; margin: 0 auto; padding: 20px; }
.result-count { font-size: 0.85rem; color: var(--text-muted); margin-bottom: 12px; }
.result-item {
  background: var(--card-bg); border: 1px solid var(--border); border-radius: var(--radius);
  padding: 14px 18px; margin-bottom: 10px;
}
.result-meta { font-size: 0.8rem; color: var(--text-muted); margin-bottom: 6px; display: flex; gap: 10px; flex-wrap: wrap; }
.result-meta .badge { background: var(--accent); padding: 1px 8px; border-radius: 4px; color: var(--primary); }
.result-title { font-weight: 600; font-size: 0.95rem; margin-bottom: 4px; }
.result-text { font-size: 0.88rem; color: #444; max-height: 4.5em; overflow: hidden; }
.result-actions { margin-top: 8px; display: flex; gap: 8px; }
.result-actions a, .result-actions button {
  font-size: 0.78rem; padding: 2px 10px; border: 1px solid var(--border);
  border-radius: 4px; text-decoration: none; white-space: nowrap; background: var(--card-bg);
  cursor: pointer; color: var(--text); font-family: inherit;
}
.result-actions a:hover, .result-actions button:hover { background: var(--accent); text-decoration: none; }
.no-results { text-align: center; padding: 40px; color: var(--text-muted); }
.coll-hint { padding: 20px; text-align: center; color: var(--text-muted); font-size: 0.88rem; }
</style>
</head>
<body data-page="search">
{% include '_nav.html' %}
<div class="search-bar">
  <input type="text" id="searchInput" placeholder="输入搜索词..." autocomplete="off" value="{{ q }}">
  <button type="button" id="searchBtn" onclick="doSearch()" {% if not collection %}disabled{% endif %}>搜索</button>
</div>
<div class="main">
  <div id="resultCount" class="result-count"></div>
  <div id="results">
    {% if not collection %}
    <div class="coll-hint">请先在导航栏选择一个书架</div>
    {% endif %}
  </div>
</div>

{% include '_preview_modal.html' %}

<script src="/static/nav.js"></script>
<script src="/static/preview-modal.js"></script>
<script>
var currentCollection = {{ collection | tojson }};
var currentQuery = {{ q | tojson }};
var highlightTerms = {{ highlight_terms | tojson }};

function escapeHtml(s){var d=document.createElement('div');d.textContent=s||'';return d.innerHTML;}
function attrEsc(s){return String(s==null?'':s).replace(/&/g,'&amp;').replace(/"/g,'&quot;');}

async function doSearch(){
  var q=document.getElementById('searchInput').value.trim();
  if(!q||!currentCollection) return;
  currentQuery=q;
  var btn=document.getElementById('searchBtn');
  btn.disabled=true;btn.textContent='搜索中...';
  var params=new URLSearchParams({q:q,limit:30});
  try{
    var res=await fetch('/collections/'+encodeURIComponent(currentCollection)+'/search?'+params);
    var data=await res.json();
    renderResults(data);
  }catch(e){
    document.getElementById('results').innerHTML='<div class="no-results">搜索出错: '+escapeHtml(e.message)+'</div>';
  }finally{
    btn.disabled=false;btn.textContent='搜索';
  }
}

function renderResults(data){
  var countEl=document.getElementById('resultCount');
  var container=document.getElementById('results');
  if(!data.results||data.results.length===0){
    countEl.textContent='';
    container.innerHTML='<div class="no-results">未找到匹配结果</div>';
    return;
  }
  countEl.textContent='找到 '+data.count+' 条结果';
  container.innerHTML='';
  for(var i=0;i<data.results.length;i++){
    var r=data.results[i];
    var div=document.createElement('div');
    div.className='result-item';
    var preview=r.text.length>300?r.text.slice(0,300)+'...':r.text;
    var collEnc=encodeURIComponent(currentCollection);
    var proofUrl='/collections/'+collEnc+'/doc/'+r.doc_id+'/proofread?page='+r.page_num+'&keyword='+encodeURIComponent(currentQuery)+'&block='+r.block_num;
    if(r.line_id)proofUrl+='&line='+r.line_id;
    div.innerHTML=
      '<div class="result-meta">'+
        '<span class="badge">'+escapeHtml(currentCollection)+'</span>'+
        '<span>第 '+r.page_num+' 页 / 段 '+r.block_num+'</span>'+
        (r.cite_key?'<span>['+escapeHtml(r.cite_key)+']</span>':'')+
      '</div>'+
      '<div class="result-title">'+escapeHtml(r.title)+'</div>'+
      '<div class="result-text">'+preview+'</div>'+
      '<div class="result-actions">'+
        '<a href="'+proofUrl+'" target="_blank">校对</a>'+
        '<button type="button" onclick="pmOpen('+attrEsc(JSON.stringify(currentCollection))+','+r.doc_id+',{pageNum:'+r.page_num+',blockNum:'+r.block_num+',highlightTerms:highlightTerms,title:'+attrEsc(JSON.stringify(r.title||''))+'})">预览</button>'+
      '</div>';
    container.appendChild(div);
  }
}

document.getElementById('searchInput').addEventListener('keydown',function(e){
  if(e.key==='Enter')doSearch();
});

if(currentQuery&&currentCollection){
  doSearch();
}
</script>
</body>
</html>
