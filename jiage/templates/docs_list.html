<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="icon" href="/favicon.ico">
<title>文献列表 — 小書房</title>
<link rel="stylesheet" href="/static/app.css">
<style>
.container{max-width:1200px;margin:0 auto;padding:20px;}
.top-bar{display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between;margin-bottom:16px;}
.filter-row{display:flex;flex-wrap:wrap;gap:10px;align-items:center;background:var(--card-bg);padding:14px;border-radius:var(--radius);border:1px solid var(--border);margin-bottom:12px;}
.filter-row input[type="text"]{min-width:120px;}
.filter-row select,.filter-row input{
  padding:5px 8px;border:1px solid var(--border);border-radius:5px;font-size:0.85rem;background:var(--card-bg);
}
.tag-chip{
  display:inline-block;padding:3px 10px;border-radius:12px;font-size:0.75rem;
  background:var(--accent);color:var(--primary);margin-right:4px;cursor:pointer;border:1px solid transparent;
}
.tag-chip.active{background:var(--primary);color:#fff;}
.toolbar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;background:var(--card-bg);padding:12px 14px;border-radius:var(--radius);border:1px solid var(--border);margin-bottom:12px;}
.toolbar label{font-size:0.85rem;display:flex;align-items:center;gap:4px;cursor:pointer;}
.toolbar .spacer{flex:1;}
.toolbar select{padding:5px 8px;border:1px solid var(--border);border-radius:5px;font-size:0.85rem;background:var(--card-bg);}
table{width:100%;border-collapse:collapse;background:var(--card-bg);border-radius:var(--radius);overflow:hidden;border:1px solid var(--border);font-size:0.85rem;}
th,td{padding:10px 12px;text-align:left;border-bottom:1px solid var(--border);vertical-align:top;}
th{background:var(--accent);color:var(--primary);font-weight:600;}
tr:hover{background:var(--bg);}
tr.selected td{background:#e8f4e8;}
td.cite{font-family:"SFMono-Regular",Consolas,monospace;font-size:0.78rem;color:var(--text-muted);}
td.title{font-weight:600;}
td .meta{color:var(--text-muted);font-size:0.75rem;}
td .badge{display:inline-block;padding:2px 8px;border-radius:10px;font-size:0.72rem;background:#eee;margin-right:4px;}
td .badge.book{background:#e8eef4;color:#3d5a80;}
td .badge.article{background:#e8f4e8;color:#27ae60;}
td .badge.manuscript{background:#f9f2e6;color:#b38b00;}
td .badge.online{background:#f4e8f4;color:#8e44ad;}
td .badge.incollection{background:#f0e8e6;color:#8e44ad;}
.actions a{font-size:0.8rem;margin-right:8px;}
.bm-overlay{display:none;position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.5);z-index:200;align-items:center;justify-content:center;}
.bm-modal{background:var(--card-bg);border-radius:var(--radius);width:90%;max-width:800px;max-height:85vh;display:flex;flex-direction:column;}
.bm-header{display:flex;justify-content:space-between;align-items:center;padding:14px 18px;border-bottom:1px solid var(--border);}
.bm-title{font-weight:700;font-size:1rem;}
.bm-close{background:none;border:none;font-size:1.4rem;cursor:pointer;color:var(--text-muted);}
.bm-body{padding:18px;overflow-y:auto;flex:1;}
.bm-section{margin-bottom:16px;}
.bm-section-title{font-weight:600;font-size:0.88rem;margin-bottom:8px;color:var(--primary);}
.bm-row{display:flex;align-items:center;gap:8px;padding:6px 0;border-bottom:1px solid var(--bg);font-size:0.82rem;}
.bm-row .bm-doc{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.bm-row .bm-arrow{color:var(--text-muted);}
.bm-row .bm-entry{flex:1.5;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.bm-row .bm-type{font-family:monospace;font-size:0.72rem;color:var(--text-muted);}
.bm-select{max-width:300px;padding:4px;border:1px solid var(--border);border-radius:4px;font-size:0.8rem;}
.empty{padding:40px;text-align:center;color:var(--text-muted);}
.pager{display:flex;gap:8px;align-items:center;justify-content:center;margin-top:16px;}
.pager button{min-width:28px;padding:4px 8px;border:1px solid var(--border);border-radius:5px;background:var(--card-bg);cursor:pointer;}
.pager button.active{background:var(--primary);color:#fff;border-color:var(--primary);}
.pager button:disabled{opacity:0.5;cursor:not-allowed;}
.pager .info{font-size:0.8rem;color:var(--text-muted);}
@media(max-width:768px){
  .filter-row,.toolbar{flex-direction:column;align-items:stretch;}
  .toolbar .spacer{display:none;}
  table{font-size:0.75rem;}
  th,td{padding:8px;}
  .actions a{display:inline-block;margin-bottom:4px;}
}
</style>
</head>
<body data-page="docs">
{% include '_nav.html' %}
<div class="container">
  <div class="top-bar">
    <div class="top-bar-right" id="statsSummary"></div>
  </div>

  <div class="filter-row">
    <span style="font-size:0.85rem;color:var(--text-muted);">来源类型:</span>
    <span id="tagFilter"></span>
    <input type="text" id="authorFilter" placeholder="作者" style="width:100px;">
    <select id="bibTypeFilter"><option value="">文献类型</option></select>
    <input type="text" id="titleFilter" placeholder="标题" style="width:140px;">
    <input type="text" id="yearFilter" placeholder="年份" style="width:70px;">
    <button class="btn" onclick="resetFilters()">重置</button>
  </div>

  <div class="toolbar">
    <label><input type="checkbox" id="selectAll" onchange="toggleSelectAll()"> 全选</label>
    <div class="spacer"></div>
    <span style="font-size:0.8rem;color:var(--text-muted);">排序</span>
    <select id="sortSelect" onchange="loadPage(1)">
      <option value="created_at">创建时间</option>
      <option value="title">标题</option>
      <option value="author">作者</option>
      <option value="cite_key">cite_key</option>
      <option value="page_count">页数</option>
    </select>
    <select id="orderSelect" onchange="loadPage(1)">
      <option value="desc">降序</option>
      <option value="asc">升序</option>
    </select>
    <span style="font-size:0.8rem;color:var(--text-muted);">每页</span>
    <select id="pageSize" onchange="loadPage(1)">
      <option value="20">20</option>
      <option value="50">50</option>
      <option value="100">100</option>
    </select>
    <button class="btn" onclick="exportBib()">导出 BibTeX</button>
    <button class="btn" onclick="exportAllBib()">导出全部 BibTeX</button>
    <button class="btn" onclick="exportMd()">导出 Markdown</button>
    <button class="btn" onclick="exportArchive()">导出数据包</button>
    <button class="btn" onclick="openBibMatch()" id="btnBibMatch">批量导入 BibTeX</button>
  </div>

  <table>
    <thead>
      <tr>
        <th style="width:30px;"></th>
        <th>cite_key</th>
        <th>标题 / 作者</th>
        <th>类型</th>
        <th>页数</th>
        <th>创建时间</th>
        <th>操作</th>
      </tr>
    </thead>
    <tbody id="docTableBody">
      <tr><td colspan="7" class="empty">加载中…</td></tr>
    </tbody>
  </table>

  <div class="pager" id="pager"></div>
</div>

<div class="bm-overlay" id="bmOverlay">
  <div class="bm-modal">
    <div class="bm-header">
      <span class="bm-title">批量导入 BibTeX</span>
      <button class="bm-close" onclick="closeBibMatch()">&times;</button>
    </div>
    <div class="bm-body">
      <div id="bmStep1">
        <input type="file" id="bmFile" accept=".bib,.bibtex,.txt" onchange="bmLoadFile(this)" style="margin-bottom:10px;">
        <div style="margin:8px 0;color:var(--text-muted);font-size:0.82rem;">或直接粘贴 .bib 内容:</div>
        <textarea id="bmPaste" rows="10" placeholder="@article{...}" style="width:100%;font-family:monospace;font-size:0.82rem;padding:8px;border:1px solid var(--border);border-radius:5px;box-sizing:border-box;"></textarea>
        <div style="margin-top:12px;text-align:right;">
          <button class="btn" onclick="startBibMatch()">开始匹配</button>
        </div>
      </div>
      <div id="bmStep2" style="display:none;">
        <div id="bmResults"></div>
        <div style="margin-top:12px;text-align:right;">
          <button class="btn" onclick="applyBibMatch()">应用选中项</button>
        </div>
      </div>
    </div>
  </div>
</div>

<div class="msg" id="msg"></div>

{% include '_preview_modal.html' %}

<script src="/static/nav.js"></script>
<script src="/static/preview-modal.js"></script>
<script>
const collection = {{ collection | tojson }};
const sourceTags = {{ source_tags | tojson }};
const bibTypeLabels = {{ bib_type_labels | tojson }};
const BIB_TYPES = [
  {key:'@book', label:'图书'},
  {key:'@article', label:'期刊/报纸'},
  {key:'@manuscript', label:'手稿/档案'},
  {key:'@online', label:'电子出版物'},
  {key:'@incollection', label:'析出文献'}
];
let state = {page:1, total:0, pages:0, docs:[]};
let selectedIds = new Set();

function init(){
  fillTagFilter();
  fillBibTypeFilter();
  loadPage(1);
}

function fillTagFilter(){
  const box = document.getElementById('tagFilter');
  box.innerHTML = '';
  sourceTags.forEach(tag => {
    const s = document.createElement('span');
    s.className = 'tag-chip';
    s.textContent = tag;
    s.dataset.tag = tag;
    s.onclick = () => {s.classList.toggle('active'); loadPage(1);};
    box.appendChild(s);
  });
}

function fillBibTypeFilter(){
  const sel = document.getElementById('bibTypeFilter');
  BIB_TYPES.forEach(t => {
    const opt = document.createElement('option');
    opt.value = t.key; opt.textContent = t.label;
    sel.appendChild(opt);
  });
}

function getActiveTag(){
  const active = document.querySelector('#tagFilter .tag-chip.active');
  return active ? active.dataset.tag : '';
}

function buildParams(){
  const ps = new URLSearchParams();
  ps.set('page', state.page);
  ps.set('limit', document.getElementById('pageSize').value);
  ps.set('sort', document.getElementById('sortSelect').value);
  ps.set('order', document.getElementById('orderSelect').value);
  const tag = getActiveTag();
  if(tag) ps.set('tag', tag);
  const author = document.getElementById('authorFilter').value.trim();
  if(author) ps.set('author', author);
  const bibType = document.getElementById('bibTypeFilter').value;
  if(bibType) ps.set('bib_type', bibType);
  const title = document.getElementById('titleFilter').value.trim();
  if(title) ps.set('title', title);
  const year = document.getElementById('yearFilter').value.trim();
  if(year) ps.set('year', year);
  return ps.toString();
}

async function loadPage(page){
  state.page = page;
  const url = '/collections/' + encodeURIComponent(collection) + '/docs/query?' + buildParams();
  const tbody = document.getElementById('docTableBody');
  tbody.innerHTML = '<tr><td colspan="7" class="empty">加载中…</td></tr>';
  try{
    const r = await fetch(url);
    const data = await r.json();
    if(data.error){showMsg(data.error,'err'); return;}
    state.total = data.total;
    state.pages = data.pages;
    state.docs = data.docs;
    renderTable(data.docs);
    renderPager();
    updateSelectAllState();
    document.getElementById('statsSummary').textContent = '共 ' + data.total + ' 篇';
  }catch(e){
    tbody.innerHTML = '<tr><td colspan="7" class="empty">加载失败</td></tr>';
    showMsg('加载失败: '+e.message,'err');
  }
}

function fmtDate(s){
  if(!s) return '-';
  const d = new Date(s);
  if(isNaN(d)) return s;
  return d.toLocaleDateString('zh-CN');
}

function typeBadge(bibType){
  const label = bibTypeLabels[bibType] || '文献';
  const cls = (bibType||'').replace('@','') || 'misc';
  return '<span class="badge ' + cls + '">' + label + '</span>';
}

function escapeHtml(s){
  return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}
function attrEsc(s){return String(s==null?'':s).replace(/&/g,'&amp;').replace(/"/g,'&quot;');}

function renderTable(docs){
  const tbody = document.getElementById('docTableBody');
  if(!docs || docs.length === 0){
    tbody.innerHTML = '<tr><td colspan="7" class="empty">没有文献</td></tr>';
    return;
  }
  let html = '';
  const collEnc = encodeURIComponent(collection);
  docs.forEach(d => {
    const checked = selectedIds.has(d.id) ? 'checked' : '';
    const tags = (JSON.parse(d.source_tags || '[]') || []).map(t => '<span class="badge">'+escapeHtml(t)+'</span>').join('');
    html += '<tr id="row-'+d.id+'" class="'+ (selectedIds.has(d.id)?'selected':'') + '">' +
      '<td><input type="checkbox" '+checked+' onchange="toggleRow('+d.id+',this)"></td>' +
      '<td class="cite">' + escapeHtml(d.cite_key || '-') + '</td>' +
      '<td class="title">' + escapeHtml(d.title || '(无标题)') +
        '<div class="meta">' + escapeHtml(d.author || '') + '</div>' +
        '<div>' + tags + '</div></td>' +
      '<td>' + typeBadge(d.bib_type) + '</td>' +
      '<td>' + (d.page_count || '-') + '</td>' +
      '<td>' + fmtDate(d.created_at) + '</td>' +
      '<td class="actions">' +
        '<a href="/collections/' + collEnc + '/doc/' + d.id + '/proofread">校对</a>' +
        '<button class="btn" style="padding:2px 10px;font-size:0.8rem;" onclick="pmOpen('+attrEsc(JSON.stringify(collection))+','+d.id+',{title:'+attrEsc(JSON.stringify(d.title||''))+'})">预览</button>' +
      '</td></tr>';
  });
  tbody.innerHTML = html;
}

function renderPager(){
  const box = document.getElementById('pager');
  if(state.pages <= 1){box.innerHTML = ''; return;}
  let html = '<button ' + (state.page<=1?'disabled':'') + ' onclick="loadPage('+(state.page-1)+')">←</button>';
  const maxButtons = 7;
  let start = Math.max(1, state.page - Math.floor(maxButtons/2));
  let end = Math.min(state.pages, start + maxButtons - 1);
  if(end - start + 1 < maxButtons) start = Math.max(1, end - maxButtons + 1);
  if(start > 1) html += '<button onclick="loadPage(1)">1</button><span>…</span>';
  for(let i=start;i<=end;i++){
    html += '<button class="'+(i===state.page?'active':'')+'" onclick="loadPage('+i+')">'+i+'</button>';
  }
  if(end < state.pages) html += '<span>…</span><button onclick="loadPage('+state.pages+')">'+state.pages+'</button>';
  html += '<button ' + (state.page>=state.pages?'disabled':'') + ' onclick="loadPage('+(state.page+1)+')">→</button>';
  html += '<span class="info">第 '+state.page+'/'+state.pages+' 页</span>';
  box.innerHTML = html;
}

function toggleRow(id, cb){
  const row = document.getElementById('row-'+id);
  if(cb.checked){selectedIds.add(id); row.classList.add('selected');}
  else{selectedIds.delete(id); row.classList.remove('selected');}
  updateSelectAllState();
}

function toggleSelectAll(){
  const cb = document.getElementById('selectAll');
  const cbs = document.querySelectorAll('#docTableBody input[type=checkbox]');
  cbs.forEach(c => {
    const id = parseInt(c.getAttribute('onchange').match(/\d+/)[0]);
    c.checked = cb.checked;
    const row = document.getElementById('row-'+id);
    if(cb.checked){selectedIds.add(id); row.classList.add('selected');}
    else{selectedIds.delete(id); row.classList.remove('selected');}
  });
}

function updateSelectAllState(){
  const cbs = document.querySelectorAll('#docTableBody input[type=checkbox]');
  if(cbs.length === 0){document.getElementById('selectAll').checked = false; return;}
  const all = Array.from(cbs).every(c => c.checked);
  document.getElementById('selectAll').checked = all;
}

function resetFilters(){
  document.getElementById('authorFilter').value = '';
  document.getElementById('bibTypeFilter').value = '';
  document.getElementById('titleFilter').value = '';
  document.getElementById('yearFilter').value = '';
  document.querySelectorAll('#tagFilter .tag-chip').forEach(s => s.classList.remove('active'));
  loadPage(1);
}

function getSelectedIds(){
  if(selectedIds.size === 0){showMsg('请先选择文献','err'); return null;}
  return Array.from(selectedIds);
}

async function exportBib(){
  const ids = getSelectedIds(); if(!ids) return;
  await downloadPost('/collections/' + encodeURIComponent(collection) + '/docs/export-bib', {ids}, 'jiage_export.bib', 'application/x-bibtex');
}

async function exportAllBib(){
  await downloadPost('/collections/' + encodeURIComponent(collection) + '/docs/export-bib', {ids:[]}, collection + '_all.bib', 'application/x-bibtex');
}

async function exportMd(){
  const ids = getSelectedIds(); if(!ids) return;
  await downloadPost('/collections/' + encodeURIComponent(collection) + '/docs/export-md', {ids}, 'jiage_docs.zip', 'application/zip');
}

async function exportArchive(){
  const ids = getSelectedIds(); if(!ids) return;
  await downloadPost('/collections/' + encodeURIComponent(collection) + '/docs/export-archive', {ids}, 'jiage_archive.tar.gz', 'application/gzip');
}

async function downloadPost(url, body, filename, mime){
  try{
    const r = await fetch(url, {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify(body)});
    if(!r.ok){const e = await r.json(); showMsg(e.error || '导出失败','err'); return;}
    const blob = await r.blob();
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = filename;
    a.click();
    URL.revokeObjectURL(a.href);
    showMsg('导出成功','ok');
  }catch(e){showMsg('导出失败: '+e.message,'err');}
}

function showMsg(text, type){
  const m = document.getElementById('msg');
  m.textContent = text; m.className = 'msg show ' + (type || 'ok');
  setTimeout(() => m.classList.remove('show'), 3000);
}

let bmState = {entries: []};

function openBibMatch(){
  if(!getSelectedIds()) return;
  document.getElementById('bmOverlay').style.display = 'flex';
  document.getElementById('bmStep1').style.display = '';
  document.getElementById('bmStep2').style.display = 'none';
  document.getElementById('bmPaste').value = '';
  document.getElementById('bmFile').value = '';
}
function closeBibMatch(){document.getElementById('bmOverlay').style.display = 'none';}
function bmLoadFile(input){
  const f = input.files[0]; if(!f) return;
  const rd = new FileReader();
  rd.onload = e => {document.getElementById('bmPaste').value = e.target.result;};
  rd.readAsText(f);
}
async function startBibMatch(){
  const txt = document.getElementById('bmPaste').value.trim();
  if(!txt){showMsg('请粘贴或上传 .bib 内容','err'); return;}
  const ids = Array.from(selectedIds);
  try{
    const r = await fetch('/collections/' + encodeURIComponent(collection) + '/docs/match-bib', {
      method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({bib_text: txt, doc_ids: ids})
    });
    const d = await r.json();
    if(!r.ok){showMsg(d.error||'匹配失败','err'); return;}
    bmState = d;
    renderBmResults(d);
    document.getElementById('bmStep1').style.display = 'none';
    document.getElementById('bmStep2').style.display = '';
  }catch(e){showMsg('请求失败: '+e.message,'err');}
}
function entryLabel(e){
  const t = e.fields.title || '(无标题)';
  const a = e.fields.author ? ' / '+e.fields.author : '';
  return t + a + ' ['+e.type+']';
}
function renderBmResults(data){
  let h = '';
  const allOpts = data.entries.map((e,i) => '<option value="'+i+'">'+escapeHtml(entryLabel(e))+'</option>').join('');
  if(data.matched.length){
    h += '<div class="bm-section"><div class="bm-section-title">✅ 已匹配 ('+data.matched.length+')</div>';
    data.matched.forEach(m => {
      const e = data.entries[m.entry_idx];
      const tag = m.match_type==='substring'?' ⚠️模糊':'';
      h += '<div class="bm-row"><input type="checkbox" checked data-doc="'+m.doc_id+'" data-idx="'+m.entry_idx+'" class="bm-check">'+
        '<span class="bm-doc">'+escapeHtml(m.doc_title)+'</span><span class="bm-arrow">→</span>'+
        '<span class="bm-entry">'+escapeHtml(e.fields.title||'')+' <span class="bm-type">'+e.type+'</span>'+tag+'</span></div>';
    });
    h += '</div>';
  }
  if(data.ambiguous.length){
    h += '<div class="bm-section"><div class="bm-section-title">⚠️ 待确认 ('+data.ambiguous.length+')</div>';
    data.ambiguous.forEach(a => {
      h += '<div class="bm-row"><span class="bm-doc">'+escapeHtml(a.doc_title)+'</span><span class="bm-arrow">→</span>'+
        '<select class="bm-select" data-doc="'+a.doc_id+'"><option value="">-- 跳过 --</option>'+
        a.candidates.map(c => '<option value="'+c[0]+'">'+escapeHtml(entryLabel(data.entries[c[0]]))+'</option>').join('')+
        '</select></div>';
    });
    h += '</div>';
  }
  if(data.unmatched_docs.length){
    h += '<div class="bm-section"><div class="bm-section-title">❌ 未匹配 ('+data.unmatched_docs.length+')</div>';
    data.unmatched_docs.forEach(d => {
      h += '<div class="bm-row"><span class="bm-doc">'+escapeHtml(d.doc_title)+'</span><span class="bm-arrow">→</span>'+
        '<select class="bm-select" data-doc="'+d.doc_id+'"><option value="">-- 跳过 --</option>'+allOpts+'</select></div>';
    });
    h += '</div>';
  }
  document.getElementById('bmResults').innerHTML = h || '<div style="padding:20px;text-align:center;color:var(--text-muted);">无结果</div>';
}
async function applyBibMatch(){
  const updates = [];
  document.querySelectorAll('.bm-check:checked').forEach(cb => {
    const e = bmState.entries[parseInt(cb.dataset.idx)];
    updates.push({doc_id: parseInt(cb.dataset.doc), bib_type: e.type, bib_data: e.fields});
  });
  document.querySelectorAll('.bm-select').forEach(sel => {
    if(sel.value){
      const e = bmState.entries[parseInt(sel.value)];
      updates.push({doc_id: parseInt(sel.dataset.doc), bib_type: e.type, bib_data: e.fields});
    }
  });
  if(!updates.length){showMsg('没有选中任何匹配','err'); return;}
  try{
    const r = await fetch('/collections/' + encodeURIComponent(collection) + '/docs/batch-patch', {
      method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({updates})
    });
    const d = await r.json();
    if(!r.ok){showMsg(d.error||'应用失败','err'); return;}
    closeBibMatch();
    showMsg('已应用 '+d.applied+' 条元数据','ok');
    loadPage(state.page);
  }catch(e){showMsg('请求失败: '+e.message,'err');}
}

init();
</script>
