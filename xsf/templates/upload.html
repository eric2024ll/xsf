<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="icon" href="/favicon.ico">
<title>资料上传 — 小書房</title>
<link rel="stylesheet" href="/static/app.css?v={{ static_v }}">
<style>
.main { max-width: 700px; margin: 0 auto; padding: 20px; }
.tab-bar { display: flex; gap: 0; margin-bottom: 20px; border-bottom: 1px solid var(--border); }
.tab-bar button {
  padding: 10px 20px; font-size: 0.9rem; border: none; background: none;
  cursor: pointer; color: var(--text-muted);
  border-bottom: 2px solid transparent; font-weight: 500;
}
.tab-bar button.active { color: var(--primary); border-bottom-color: var(--primary); font-weight: 600; }
.tab-pane { display: none; }
.tab-pane.active { display: block; }

/* 上传表单 */
.upload-form { background: var(--card-bg); border: 1px solid var(--border); border-radius: var(--radius); padding: 20px; }
.upload-form .field { margin-bottom: 10px; }
.upload-form label { font-size: 0.82rem; color: var(--text-muted); display: block; margin-bottom: 3px; }
.upload-form input[type="text"], .upload-form input[type="file"] {
  width: 100%; padding: 7px 10px; border: 1px solid var(--border); border-radius: 5px; font-size: 0.85rem;
}
.upload-form .checkbox-row { display: flex; align-items: center; gap: 6px; font-size: 0.82rem; }
.upload-form .checkbox-row label { margin: 0; }
.upload-form button[type="submit"] {
  width: 100%; padding: 9px; background: var(--success); color: white; border: none;
  border-radius: 5px; cursor: pointer; font-size: 0.88rem; font-weight: 600; margin-top: 4px;
}
.upload-form button[type="submit"]:disabled { opacity: 0.5; cursor: not-allowed; }
.upload-status { margin-top: 8px; font-size: 0.8rem; padding: 6px 10px; border-radius: 5px; display: none; }
.upload-status.show { display: block; }
.upload-status.ok { background: #d4edda; color: #155724; }
.upload-status.err { background: #f8d7da; color: #721c24; }
.upload-status.loading { background: var(--accent); color: var(--primary); }
.file-list { margin-top: 6px; }
.file-item { display: flex; align-items: center; justify-content: space-between; gap: 8px; font-size: 0.78rem; padding: 3px 6px; background: var(--bg); border-radius: 4px; margin-bottom: 3px; }
.file-item .fname { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; flex: 1; min-width: 0; }
.file-item .fstate { font-size: 0.72rem; white-space: nowrap; flex-shrink: 0; }
.file-item .fstate.wait { color: var(--text-muted); }
.file-item .fstate.run { color: var(--primary); }
.file-item .fstate.ok { color: var(--success); }
.file-item .fstate.err { color: var(--danger); }
.tag-selector { display: flex; flex-direction: column; gap: 6px; }
.tag-presets { display: flex; gap: 6px; flex-wrap: wrap; }
.tag-custom { display: flex; gap: 6px; align-items: center; }
.tag-custom input { flex: 1; width: auto; padding: 5px 12px; font-size: 0.82rem; border: 1px solid var(--border); border-radius: 6px; outline: none; min-width: 0; }
.tag-custom input:focus { border-color: var(--primary); }
.tag-custom button { width: auto; padding: 3px 8px; font-size: 0.7rem; border: 1px solid var(--border); border-radius: 4px; background: var(--bg); cursor: pointer; white-space: nowrap; flex-shrink: 0; }
.tag-selected { display: flex; gap: 4px; flex-wrap: wrap; min-height: 18px; }

/* 导入数据包 */
.import-area { background: var(--card-bg); border: 1px solid var(--border); border-radius: var(--radius); padding: 20px; }
.import-area .hint { font-size: 0.85rem; color: var(--text-muted); margin-bottom: 12px; line-height: 1.7; }
.import-drop {
  border: 2px dashed var(--border); border-radius: var(--radius); padding: 30px;
  text-align: center; cursor: pointer; transition: border-color 0.2s, background 0.2s;
}
.import-drop:hover { border-color: var(--primary); background: var(--accent); }
.import-drop .icon { font-size: 2rem; margin-bottom: 8px; }
.import-drop .text { font-size: 0.88rem; color: var(--text-muted); }
.import-status { margin-top: 12px; font-size: 0.82rem; padding: 8px 12px; border-radius: 5px; display: none; }
.import-status.show { display: block; }
.import-status.ok { background: #d4edda; color: #155724; }
.import-status.err { background: #f8d7da; color: #721c24; }
.import-status.loading { background: var(--accent); color: var(--primary); }

/* OCR 设置 */
.ocr-form { background: var(--card-bg); border: 1px solid var(--border); border-radius: var(--radius); padding: 20px; }
.ocr-form .field { margin-bottom: 14px; }
.ocr-form label { font-size: 0.82rem; color: var(--text-muted); display: block; margin-bottom: 3px; }
.ocr-form input[type="text"], .ocr-form input[type="password"] {
  width: 100%; padding: 7px 10px; border: 1px solid var(--border); border-radius: 5px; font-size: 0.85rem; box-sizing: border-box;
}
.ocr-form .hint { font-size: 0.8rem; color: var(--text-muted); line-height: 1.7; }
.ocr-form .hint code { background: var(--bg); padding: 1px 5px; border-radius: 3px; font-size: 0.78rem; }
.provider-list { margin-bottom: 18px; }
.provider-item {
  border: 1px solid var(--border); border-radius: var(--radius); padding: 12px 14px; margin-bottom: 8px;
  background: var(--bg); display: flex; align-items: flex-start; gap: 10px; flex-wrap: wrap;
}
.provider-item.is-default { border-color: var(--primary); background: var(--accent); }
.provider-item .radio { margin-top: 3px; }
.provider-item .meta { flex: 1; min-width: 200px; }
.provider-item .pname { font-size: 0.9rem; font-weight: 600; }
.provider-item .purl { font-size: 0.75rem; color: var(--text-muted); font-family: monospace; word-break: break-all; margin-top: 2px; }
.provider-item .pinfo { font-size: 0.72rem; color: var(--text-muted); margin-top: 3px; }
.provider-item .pinfo .badge-ok { color: var(--success); font-weight: 600; }
.provider-item .pinfo .badge-def { color: var(--primary); font-weight: 600; }
.provider-item .pops { display: flex; gap: 6px; flex-shrink: 0; }
.provider-item .pops button {
  padding: 4px 10px; font-size: 0.75rem; border: 1px solid var(--border); border-radius: 4px;
  background: var(--card-bg); cursor: pointer;
}
.provider-item .pops button.btn-del { color: var(--danger); }
.provider-item .pops button:disabled { opacity: 0.5; cursor: not-allowed; }
.ocr-form .actions { display: flex; gap: 8px; margin-top: 10px; }
.ocr-form .actions button { padding: 8px 16px; border: none; border-radius: 5px; cursor: pointer; font-size: 0.85rem; font-weight: 600; }
.ocr-form .btn-save { background: var(--success); color: white; }
.ocr-form .btn-cancel { background: var(--bg); color: var(--text); border: 1px solid var(--border); }
.ocr-form .actions button:disabled { opacity: 0.5; cursor: not-allowed; }
.ocr-status { margin-top: 8px; font-size: 0.8rem; padding: 6px 10px; border-radius: 5px; display: none; }
.ocr-status.show { display: block; }
.ocr-status.ok { background: #d4edda; color: #155724; }
.ocr-status.err { background: #f8d7da; color: #721c24; }
.ocr-status.loading { background: var(--accent); color: var(--primary); }
.ocr-empty { font-size: 0.82rem; color: var(--text-muted); padding: 10px; text-align: center; }
.ocr-form .section-title { font-size: 0.88rem; font-weight: 600; margin: 4px 0 10px; }

/* SAG 同步 */
.sag-status-line { font-size: 0.82rem; margin-bottom: 12px; padding: 8px 12px; border-radius: 5px; background: var(--bg); color: var(--text-muted); }
.sag-status-line code { background: var(--card-bg); padding: 1px 5px; border-radius: 3px; font-size: 0.78rem; }
.sag-status-line.ok { color: var(--success); }
.sag-status-line.warn { color: var(--danger); }
.sag-actions { display: flex; gap: 8px; margin-bottom: 12px; flex-wrap: wrap; }
.sag-actions button { padding: 7px 14px; font-size: 0.82rem; border: none; border-radius: 5px; cursor: pointer; font-weight: 600; }
.sag-actions button:disabled { opacity: 0.5; cursor: not-allowed; }
#sagSyncDirtyBtn { background: var(--success); color: white; }
#sagForceBtn, #sagRefreshBtn { background: var(--bg); color: var(--text); border: 1px solid var(--border); }
.sag-doc-list table { width: 100%; border-collapse: collapse; font-size: 0.85rem; background: var(--card-bg); border: 1px solid var(--border); border-radius: var(--radius); }
.sag-doc-list th { background: var(--accent); color: var(--primary); padding: 8px 12px; text-align: left; font-weight: 600; font-size: 0.78rem; }
.sag-doc-list td { padding: 8px 12px; border-top: 1px solid var(--border); vertical-align: middle; }
.sag-doc-list .sdt { max-width: 280px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.sag-doc-list .sdc { color: var(--text-muted); font-size: 0.78rem; white-space: nowrap; }
.sd-state { font-size: 0.78rem; color: var(--success); white-space: nowrap; }
.sd-state.dirty { color: var(--danger); font-weight: 600; }
.sd-state.run { color: var(--primary); }
.sag-doc-list button { padding: 4px 12px; font-size: 0.75rem; border: 1px solid var(--border); border-radius: 4px; background: var(--card-bg); cursor: pointer; white-space: nowrap; }
.sag-doc-list button:disabled { opacity: 0.5; cursor: not-allowed; }
</style>
</head>
<body data-page="upload">
{% include '_nav.html' %}
<div class="main">
  <div class="tab-bar">
    <button class="active" onclick="switchTab('upload',this)">上传文件</button>
    <button onclick="switchTab('import',this)">导入数据包</button>
    <button onclick="switchTab('ocr',this)">OCR 设置</button>
    <button onclick="switchTab('sag',this)">SAG 同步</button>
  </div>

  <!-- Tab1: 上传文件 -->
  <div class="tab-pane active" id="tab-upload">
    <form class="upload-form" id="uploadForm">
      <div class="field">
        <label>文件（可多选：PDF / MD / 图片）</label>
        <input type="file" id="fileInput" accept=".pdf,.md,.markdown,.jpg,.jpeg,.png,.webp,.bmp,.tif,.tiff,.gif" multiple required>
        <div class="file-list" id="fileList"></div>
      </div>
      <div class="field">
        <label>cite_key (可选，批量时共用)</label>
        <input type="text" id="upCiteKey" placeholder="如: tang2005">
      </div>
      <div class="field">
        <label>标题 (可选，批量时共用)</label>
        <input type="text" id="upTitle">
      </div>
      <div class="field">
        <label>作者 (可选，批量时共用)</label>
        <input type="text" id="upAuthor">
      </div>
      <div class="field checkbox-row">
        <input type="checkbox" id="upOcr">
        <label for="upOcr">PDF 走 OCR 扫描件模式（图片始终 OCR）</label>
      </div>
      <div class="field">
        <label>来源标签（批量时共用）</label>
        <div class="tag-selector">
          <div class="tag-presets">
            <span class="tag-chip preset" data-tag="primary" onclick="togglePresetTag(this)">原始史料</span>
            <span class="tag-chip preset" data-tag="secondary" onclick="togglePresetTag(this)">研究文献</span>
            <span class="tag-chip preset" data-tag="reference" onclick="togglePresetTag(this)">工具书</span>
          </div>
          <div class="tag-custom">
            <input type="text" id="tagCustomInput" placeholder="自定义标签…" onkeydown="if(event.key==='Enter'){event.preventDefault();addCustomTag();}">
            <button type="button" onclick="addCustomTag()">添加</button>
          </div>
          <div class="tag-selected" id="tagSelected"></div>
        </div>
      </div>
      <button type="submit" id="uploadBtn">上传入库</button>
    </form>
    <div class="upload-status" id="uploadStatus"></div>
  </div>

  <!-- Tab2: 导入数据包 -->
  <div class="tab-pane" id="tab-import">
    <div class="import-area">
      <div class="hint">
        导入此前导出的 <code>.tar.gz</code> 数据包（含 SQLite 数据库 + 原始文件 + 清单）。<br>
        文件名冲突时会自动追加 <code>_imported</code> 后缀。
      </div>
      <div class="import-drop" onclick="document.getElementById('importArchiveInput').click()">
        <div class="icon">📦</div>
        <div class="text">点击选择 .tar.gz 数据包</div>
      </div>
      <input type="file" id="importArchiveInput" accept=".tar.gz,.tgz" style="display:none;" onchange="importArchive(this)">
      <div class="import-status" id="importStatus"></div>
    </div>
  </div>

  <!-- Tab3: OCR 设置 (generic_http provider 管理) -->
  <div class="tab-pane" id="tab-ocr">
    <div class="ocr-form">
      <div class="section-title">已添加的 OCR 服务</div>
      <div class="provider-list" id="providerList"></div>

      <div class="section-title" id="providerFormTitle">添加 OCR 服务</div>
      <input type="hidden" id="pfId" value="">
      <div class="field">
        <label>类型</label>
        <select id="pfType" onchange="onTypeChange()" style="width:100%;padding:7px 10px;border:1px solid var(--border);border-radius:5px;font-size:0.85rem;">
          <option value="generic_http">通用 HTTP 服务（本地 GPU / 自建 API）</option>
          <option value="aistudio">aistudio 云端（内置，免 URL）</option>
        </select>
      </div>
      <div class="field">
        <label>名称</label>
        <input type="text" id="pfName" placeholder="如: 本机 GPU / aistudio 云端">
      </div>
      <div class="field" id="pfUrlRow">
        <label>URL</label>
        <input type="text" id="pfUrl" placeholder="http://127.0.0.1:8091/ocr">
      </div>
      <div class="field">
        <label>API Key（aistudio 即其 token；编辑时留空保留原值）</label>
        <input type="password" id="pfKey" placeholder="aistudio 类型必填；其他留空 = 不鉴权">
      </div>
      <div class="field">
        <label>Model（可选）</label>
        <input type="text" id="pfModel" placeholder="如: PaddleOCR-VL-1.6（留空用默认）">
      </div>
      <div class="hint" id="pfHint">
        通用类型契约：<code>POST 文件 → {pages:[{parsing_res_list,…}]}</code>。本地模型先包装成 HTTP 服务再添加。
        上传 OCR 始终使用默认服务（点选列表项切换）。
      </div>
      <div class="actions">
        <button class="btn-save" id="pfSaveBtn" onclick="saveProvider()">保存</button>
        <button class="btn-cancel" id="pfCancelBtn" onclick="resetProviderForm()" style="display:none;">取消编辑</button>
      </div>
      <div class="ocr-status" id="ocrStatus"></div>
    </div>
  </div>

  <!-- Tab4: SAG 同步 -->
  <div class="tab-pane" id="tab-sag">
    <div class="sag-status-line" id="sagStatusLine">检查 SAG 状态…</div>
    <div class="sag-actions">
      <button id="sagSyncDirtyBtn" onclick="sagSyncDirty()">同步全部待同步</button>
      <button id="sagForceBtn" onclick="sagForceAll()">强制全部重同步</button>
      <button id="sagRefreshBtn" onclick="loadSagDocs()">刷新</button>
    </div>
    <div class="sag-doc-list" id="sagDocList"></div>
    <div class="ocr-status" id="sagStatus"></div>
  </div>
</div>

<div class="msg" id="msg"></div>

<script src="/static/nav.js?v={{ static_v }}"></script>
<script>
var currentCollection = {{ collection | tojson }};
var _TAG_LABELS = {primary:'原始史料', secondary:'研究文献', reference:'工具书'};
var _uploadTags = ['primary'];
var _ACCEPT_EXT = new Set(['pdf','md','markdown','jpg','jpeg','png','webp','bmp','tif','tiff','gif']);

function escapeHtml(s){var d=document.createElement('div');d.textContent=s||'';return d.innerHTML;}
function tagLabel(t){return _TAG_LABELS[t]||t;}

var _sagLoaded = false;
function switchTab(name,btn){
  document.querySelectorAll('.tab-pane').forEach(function(p){p.classList.remove('active');});
  document.getElementById('tab-'+name).classList.add('active');
  document.querySelectorAll('.tab-bar button').forEach(function(b){b.classList.remove('active');});
  btn.classList.add('active');
  if(name==='sag' && !_sagLoaded){ _sagLoaded = true; loadSagStatus(); loadSagDocs(); }
}

/* ── 来源标签 ── */
function renderUploadTags(){
  var sel=document.getElementById('tagSelected');
  sel.innerHTML=_uploadTags.map(function(t,i){
    return '<span class="tag-chip active removable" onclick="removeUploadTag('+i+')">'+escapeHtml(tagLabel(t))+'</span>';
  }).join('');
  document.querySelectorAll('.tag-chip.preset').forEach(function(el){
    el.classList.toggle('active',_uploadTags.indexOf(el.dataset.tag)>=0);
  });
}
function togglePresetTag(el){
  var tag=el.dataset.tag;var idx=_uploadTags.indexOf(tag);
  if(idx>=0)_uploadTags.splice(idx,1);else _uploadTags.push(tag);
  if(!_uploadTags.length)_uploadTags=['primary'];
  renderUploadTags();
}
function addCustomTag(){
  var input=document.getElementById('tagCustomInput');var val=input.value.trim();
  if(!val)return;
  if(_uploadTags.indexOf(val)<0)_uploadTags.push(val);
  input.value='';renderUploadTags();
}
function removeUploadTag(i){
  _uploadTags.splice(i,1);
  if(!_uploadTags.length)_uploadTags=['primary'];
  renderUploadTags();
}
renderUploadTags();

/* ── 文件上传 ── */
function fileExt(name){if(!name||name.indexOf('.')<0)return'';return name.toLowerCase().split('.').pop();}
function renderFileList(files){
  var list=document.getElementById('fileList');list.innerHTML='';
  if(!files||!files.length)return;
  for(var i=0;i<files.length;i++){
    var f=files[i];var ext=fileExt(f.name);var valid=_ACCEPT_EXT.has(ext);
    var needOcr=['jpg','jpeg','png','webp','bmp','tif','tiff','gif'].indexOf(ext)>=0;
    var tag=needOcr?' (OCR)':'';
    var div=document.createElement('div');div.className='file-item';div.dataset.name=f.name;
    div.innerHTML='<span class="fname">'+escapeHtml(f.name)+tag+'</span>'+
      '<span class="fstate '+(valid?'wait':'err')+'">'+(valid?'待传':'不支持')+'</span>';
    list.appendChild(div);
  }
}
document.getElementById('fileInput').addEventListener('change',function(e){renderFileList(e.target.files);});

document.getElementById('uploadForm').addEventListener('submit', async function(e){
  e.preventDefault();
  if(!currentCollection){alert('请先选择书架');return;}
  var statusEl=document.getElementById('uploadStatus');
  var btn=document.getElementById('uploadBtn');
  var fileInput=document.getElementById('fileInput');
  var files=Array.from(fileInput.files).filter(function(f){return _ACCEPT_EXT.has(fileExt(f.name));});
  if(!files.length){alert('请选择有效文件');return;}
  var citeKey=document.getElementById('upCiteKey').value;
  var title=document.getElementById('upTitle').value;
  var author=document.getElementById('upAuthor').value;
  var ocr=document.getElementById('upOcr').checked;
  var sourceTags=JSON.stringify(_uploadTags);
  btn.disabled=true;statusEl.className='upload-status show loading';
  var itemEls={};
  Array.from(document.getElementById('fileList').children).forEach(function(el){
    itemEls[el.dataset.name]=el.querySelector('.fstate');
  });
  var okCount=0,failCount=0;
  for(var i=0;i<files.length;i++){
    var f=files[i];var stEl=itemEls[f.name];
    if(stEl){stEl.className='fstate run';stEl.textContent=(i+1)+'/'+files.length;}
    statusEl.textContent='正在处理 ('+(i+1)+'/'+files.length+'): '+f.name;
    try{
      var fd=new FormData();
      fd.append('files',f);fd.append('cite_key',citeKey);fd.append('title',title);
      fd.append('author',author);fd.append('ocr',ocr);fd.append('source_tags',sourceTags);
      var res=await fetch('/collections/'+encodeURIComponent(currentCollection)+'/add',{method:'POST',body:fd});
      var data=await res.json();
      var okR=(data.results||[]).filter(function(r){return r.filename===f.name;});
      var errs=(data.errors||[]).filter(function(r){return r.filename===f.name;});
      if(okR.length){if(stEl){stEl.className='fstate ok';stEl.textContent='✓'+(okR[0].result.blocks||0)+'块';}okCount++;}
      else{if(stEl){stEl.className='fstate err';stEl.textContent='失败';}failCount++;}
    }catch(err){if(stEl){stEl.className='fstate err';stEl.textContent='失败';}failCount++;}
  }
  if(failCount===0){statusEl.className='upload-status show ok';statusEl.textContent='全部成功：'+okCount+' 个文件';}
  else if(okCount===0){statusEl.className='upload-status show err';statusEl.textContent='全部失败：'+failCount+' 个';}
  else{statusEl.className='upload-status show ok';statusEl.textContent='成功 '+okCount+' / 失败 '+failCount;}
  btn.disabled=false;
  if(okCount>0){document.getElementById('uploadForm').reset();document.getElementById('fileList').innerHTML='';renderUploadTags();}
});

/* ── 导入数据包 ── */
async function importArchive(input){
  var f=input.files[0];if(!f)return;input.value='';
  var st=document.getElementById('importStatus');
  st.className='import-status show loading';st.textContent='导入中…请稍候';
  try{
    var fd=new FormData();fd.append('file',f);
    var r=await fetch('/collections/'+encodeURIComponent(currentCollection)+'/docs/import-archive',{method:'POST',body:fd});
    var data=await r.json();
    if(data.error){st.className='import-status show err';st.textContent='导入失败: '+data.error;return;}
    st.className='import-status show ok';
    st.textContent='已导入 '+data.imported+' 篇'+(data.conflicts.length?'（'+data.conflicts.length+' 个文件名冲突已重命名）':'');
  }catch(e){st.className='import-status show err';st.textContent='导入失败: '+e.message;}
}

/* ── OCR 设置 (generic_http provider 管理) ── */
function ocrStatusEl(msg, cls) {
  var st = document.getElementById('ocrStatus');
  st.className = 'ocr-status show ' + cls;
  st.textContent = msg;
}
function resetProviderForm() {
  document.getElementById('pfId').value = '';
  document.getElementById('pfType').value = 'generic_http';
  document.getElementById('pfName').value = '';
  document.getElementById('pfUrl').value = '';
  document.getElementById('pfKey').value = '';
  document.getElementById('pfModel').value = '';
  document.getElementById('providerFormTitle').textContent = '添加 OCR 服务';
  document.getElementById('pfCancelBtn').style.display = 'none';
  onTypeChange();
}
function onTypeChange() {
  var t = document.getElementById('pfType').value;
  var isAi = t === 'aistudio';
  document.getElementById('pfUrlRow').style.display = isAi ? 'none' : '';
  var hint = document.getElementById('pfHint');
  if (isAi) {
    hint.innerHTML = 'aistudio 内置三阶段协议 (提交→轮询→取结果)，只需填 token。单文件 &lt; 100 页。';
  } else {
    hint.innerHTML = '通用类型契约：<code>POST 文件 → {pages:[{parsing_res_list,…}]}</code>。本地模型先包装成 HTTP 服务再添加。上传 OCR 始终使用默认服务（点选列表项切换）。';
  }
}
var _providers = [], _defaultPid = null;
async function loadProviders() {
  try {
    var r = await fetch('/api/ocr-config');
    var data = await r.json();
    _providers = data.providers || [];
    _defaultPid = data.default;
    renderProviders();
  } catch (e) { /* 静默 */ }
}
function renderProviders() {
  var el = document.getElementById('providerList');
  if (!_providers.length) {
    el.innerHTML = '<div class="ocr-empty">尚未添加 OCR 服务。在下方表单添加第一个（本地服务或远程 API）。</div>';
    return;
  }
  el.innerHTML = _providers.map(function(p) {
    var isDef = p.id === _defaultPid;
    return '<div class="provider-item' + (isDef ? ' is-default' : '') + '">' +
      '<input type="radio" name="defProvider" class="radio" ' + (isDef ? 'checked' : '') +
      ' title="设为默认" onchange="setDefault(\'' + p.id + '\')">' +
      '<div class="meta">' +
      '<div class="pname">' + escapeHtml(p.name) + (isDef ? ' <span class="badge-def">默认</span>' : '') +
      (p.type === 'aistudio' ? ' <span class="badge-def" style="color:var(--text-muted)">aistudio</span>' : '') + '</div>' +
      '<div class="purl">' + (p.type === 'aistudio' ? 'aistudio 云端 (内置)' : escapeHtml(p.url)) + '</div>' +
      '<div class="pinfo">' +
      (p.has_key ? '<span class="badge-ok">🔑 已设密钥</span> · ' : '') +
      (p.model ? 'model: ' + escapeHtml(p.model) + ' · ' : '') +
      (p.updated_at ? escapeHtml(p.updated_at) : '') +
      '</div></div>' +
      '<div class="pops">' +
      '<button onclick="testProvider(\'' + p.id + '\',this)">测试</button>' +
      '<button onclick="editProvider(\'' + p.id + '\')">编辑</button>' +
      '<button class="btn-del" onclick="deleteProvider(\'' + p.id + '\')">删除</button>' +
      '</div></div>';
  }).join('');
}
async function setDefault(pid) {
  try {
    var fd = new FormData(); fd.append('id', pid);
    var r = await fetch('/api/ocr-config/default', { method: 'POST', body: fd });
    var data = await r.json();
    if (data.ok) { _defaultPid = pid; renderProviders(); ocrStatusEl('✓ 默认已切换: ' + pid, 'ok'); }
    else { ocrStatusEl('✗ ' + (data.error || '设置失败'), 'err'); loadProviders(); }
  } catch (e) { ocrStatusEl('✗ 网络错误: ' + e.message, 'err'); loadProviders(); }
}
async function testProvider(pid, btn) {
  if (btn) btn.disabled = true;
  ocrStatusEl('测试中（发送空白页 PDF，可能需数十秒）…', 'loading');
  try {
    var fd = new FormData(); fd.append('id', pid);
    var r = await fetch('/api/ocr-config/test', { method: 'POST', body: fd });
    var data = await r.json();
    if (data.ok) ocrStatusEl('✓ 连通成功（返回 ' + data.pages + ' 页）', 'ok');
    else ocrStatusEl('✗ ' + (data.error || '测试失败'), 'err');
  } catch (e) { ocrStatusEl('✗ 网络错误: ' + e.message, 'err'); }
  if (btn) btn.disabled = false;
}
function editProvider(pid) {
  var p = _providers.filter(function(x) { return x.id === pid; })[0];
  if (!p) return;
  document.getElementById('pfId').value = p.id;
  document.getElementById('pfType').value = p.type || 'generic_http';
  document.getElementById('pfName').value = p.name;
  document.getElementById('pfUrl').value = p.url || '';
  document.getElementById('pfKey').value = '';
  document.getElementById('pfModel').value = p.model || '';
  onTypeChange();
  document.getElementById('providerFormTitle').textContent = '编辑: ' + p.name;
  document.getElementById('pfCancelBtn').style.display = '';
  window.scrollTo({ top: document.body.scrollHeight, behavior: 'smooth' });
}
async function deleteProvider(pid) {
  if (!confirm('确定删除该 OCR 服务配置？')) return;
  try {
    var r = await fetch('/api/ocr-config/provider/' + encodeURIComponent(pid), { method: 'DELETE' });
    var data = await r.json();
    if (data.ok) { ocrStatusEl('✓ 已删除', 'ok'); loadProviders(); }
    else ocrStatusEl('✗ ' + (data.error || '删除失败'), 'err');
  } catch (e) { ocrStatusEl('✗ 网络错误: ' + e.message, 'err'); }
}
async function saveProvider() {
  var id = document.getElementById('pfId').value;
  var type = document.getElementById('pfType').value;
  var name = document.getElementById('pfName').value.trim();
  var url = document.getElementById('pfUrl').value.trim();
  var key = document.getElementById('pfKey').value;
  var model = document.getElementById('pfModel').value.trim();
  if (!name) { alert('名称不能为空'); return; }
  if (type === 'generic_http' && !url) { alert('URL 不能为空'); return; }
  if (type === 'aistudio' && !id && !key) { alert('aistudio 类型需要填写 token'); return; }
  var btn = document.getElementById('pfSaveBtn');
  btn.disabled = true; ocrStatusEl('保存中…', 'loading');
  try {
    var fd = new FormData();
    fd.append('name', name); fd.append('url', url); fd.append('type', type);
    fd.append('api_key', key); fd.append('model', model);
    if (id) fd.append('id', id);
    var r = await fetch('/api/ocr-config/provider', { method: 'POST', body: fd });
    var data = await r.json();
    if (data.ok) { ocrStatusEl('✓ 已保存 (' + data.id + ')', 'ok'); resetProviderForm(); loadProviders(); }
    else ocrStatusEl('✗ ' + (data.error || '保存失败'), 'err');
  } catch (e) { ocrStatusEl('✗ 网络错误: ' + e.message, 'err'); }
  btn.disabled = false;
}
loadProviders();

/* ── SAG 同步 ── */
var _sagDocs = [], _sagBusy = false, _lastSagErr = '';
function sagStatusEl(msg, cls) {
  var st = document.getElementById('sagStatus');
  st.className = 'ocr-status show ' + cls;
  st.textContent = msg;
}
async function loadSagStatus() {
  var el = document.getElementById('sagStatusLine');
  try {
    var r = await fetch('/api/sag-status');
    var d = await r.json();
    if (!d.enabled) {
      el.className = 'sag-status-line warn';
      el.innerHTML = 'SAG 未配置：设置环境变量 <code>XSF_SAG_URL</code> 后重启服务即可启用语义检索同步';
    } else if (d.healthy) {
      el.className = 'sag-status-line ok';
      el.textContent = '● SAG 在线';
    } else {
      el.className = 'sag-status-line warn';
      el.textContent = '● SAG 已配置但不可达（同步会失败；搜索已降级 FTS5）';
    }
  } catch (e) {
    el.className = 'sag-status-line warn';
    el.textContent = 'SAG 状态探测失败';
  }
}
async function loadSagDocs() {
  var el = document.getElementById('sagDocList');
  if (!currentCollection) {
    el.innerHTML = '<div class="ocr-empty">请先在导航栏选择书架</div>';
    return;
  }
  el.innerHTML = '<div class="ocr-empty">加载中…</div>';
  try {
    var r = await fetch('/collections/' + encodeURIComponent(currentCollection) + '/docs?limit=1000');
    var d = await r.json();
    _sagDocs = d.docs || [];
    renderSagDocs();
  } catch (e) {
    el.innerHTML = '<div class="ocr-empty">加载失败: ' + escapeHtml(e.message) + '</div>';
  }
}
function renderSagDocs() {
  var el = document.getElementById('sagDocList');
  if (!_sagDocs.length) {
    el.innerHTML = '<div class="ocr-empty">本书架暂无文献</div>';
    document.getElementById('sagSyncDirtyBtn').textContent = '同步全部待同步';
    return;
  }
  var dirty = _sagDocs.filter(function(d){return d.sag_dirty;}).length;
  el.innerHTML = '<table><thead><tr><th>标题</th><th>cite_key</th><th>页数</th><th>SAG 状态</th><th>操作</th></tr></thead><tbody>' +
    _sagDocs.map(function(d) {
      return '<tr>' +
        '<td class="sdt" title="' + escapeHtml(d.title || d.filename) + '">' + escapeHtml(d.title || d.filename) + '</td>' +
        '<td class="sdc">' + escapeHtml(d.cite_key || '') + '</td>' +
        '<td class="sdc">' + (d.page_count || 0) + '</td>' +
        '<td><span class="sd-state' + (d.sag_dirty ? ' dirty' : '') + '" id="sagState' + d.id + '">' + (d.sag_dirty ? '待同步' : '已同步') + '</span></td>' +
        '<td><button id="sagBtn' + d.id + '" onclick="sagSyncDoc(' + d.id + ')"' + (_sagBusy ? ' disabled' : '') + '>同步</button></td>' +
        '</tr>';
    }).join('') + '</tbody></table>';
  document.getElementById('sagSyncDirtyBtn').textContent =
    '同步全部待同步' + (dirty ? '（' + dirty + '）' : '');
}
async function sagPush(id) {
  var r = await fetch('/collections/' + encodeURIComponent(currentCollection) + '/doc/' + id + '/sag-sync', { method: 'POST' });
  var d = {};
  try { d = await r.json(); } catch (e) { /* 非 JSON 响应 */ }
  if (r.ok && d.ok) {
    for (var i = 0; i < _sagDocs.length; i++) {
      if (_sagDocs[i].id === id) { _sagDocs[i].sag_dirty = 0; break; }
    }
    return true;
  }
  _lastSagErr = d.error || ('HTTP ' + r.status);
  return false;
}
async function sagSyncDoc(id) {
  if (_sagBusy) return;
  var btn = document.getElementById('sagBtn' + id);
  var st = document.getElementById('sagState' + id);
  if (btn) btn.disabled = true;
  if (st) { st.textContent = '同步中…'; st.className = 'sd-state run'; }
  sagStatusEl('同步中 doc' + id + '（大文档需数分钟，勿关闭页面）…', 'loading');
  var ok = await sagPush(id);
  if (ok) {
    sagStatusEl('✓ 已同步: doc' + id, 'ok');
  } else {
    if (st) { st.textContent = '待同步'; st.className = 'sd-state dirty'; }
    sagStatusEl('✗ 同步失败 doc' + id + ': ' + _lastSagErr, 'err');
  }
  renderSagDocs();
}
async function sagRunList(list) {
  if (!list.length) { sagStatusEl('没有需要同步的文档', 'ok'); return; }
  _sagBusy = true;
  renderSagDocs();
  var ok = 0, fail = 0;
  for (var i = 0; i < list.length; i++) {
    var d = list[i];
    var st = document.getElementById('sagState' + d.id);
    var btn = document.getElementById('sagBtn' + d.id);
    if (btn) btn.disabled = true;
    if (st) { st.textContent = '同步中…'; st.className = 'sd-state run'; }
    sagStatusEl('批量同步 (' + (i + 1) + '/' + list.length + '): ' + (d.title || d.filename), 'loading');
    if (await sagPush(d.id)) { ok++; } else { fail++; }
    renderSagDocs();
  }
  _sagBusy = false;
  renderSagDocs();
  if (fail === 0) sagStatusEl('✓ 批量同步完成: ' + ok + ' 篇', 'ok');
  else if (ok === 0) sagStatusEl('✗ 批量同步全部失败 (' + fail + ' 篇): ' + _lastSagErr, 'err');
  else sagStatusEl('批量同步: 成功 ' + ok + ' / 失败 ' + fail + '（' + _lastSagErr + '）', 'err');
}
function sagSyncDirty() {
  if (_sagBusy) return;
  sagRunList(_sagDocs.filter(function(d) { return d.sag_dirty; }));
}
function sagForceAll() {
  if (_sagBusy) return;
  if (!confirm('忽略脏标记，整架全部重新推送到 SAG？\n大书架（多篇大部头）耗时可长达数十分钟。')) return;
  sagRunList(_sagDocs.slice());
}
</script>
