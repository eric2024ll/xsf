<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="icon" href="/favicon.ico">
<title>搜索 — 小書房</title>
<link rel="stylesheet" href="/static/app.css?v={{ static_v }}">
<style>
.search-toolbar {
  display: block; padding: 10px 14px; margin-bottom: 12px;
  background: var(--card-bg); border: 1px solid var(--border); border-radius: var(--radius);
}
.st-search-row {
  display: flex; gap: 8px; align-items: center;
}
.st-search-row input[type="text"] {
  flex: 1; min-width: 120px; padding: 7px 12px; border: 1px solid var(--border);
  border-radius: var(--radius); font-size: 0.9rem; outline: none;
}
.st-search-row input[type="text"]:focus { border-color: var(--primary); }
.st-search-row select {
  padding: 7px 10px; border: 1px solid var(--border); border-radius: var(--radius);
  font-size: 0.85rem; background: var(--card-bg); color: var(--text); cursor: pointer; flex-shrink: 0;
}
.st-search-row button {
  padding: 7px 20px; background: var(--primary); color: #fff; border: none;
  border-radius: var(--radius); cursor: pointer; font-size: 0.9rem; font-weight: 600; flex-shrink: 0;
}
.st-search-row button:hover { background: var(--primary-hover); }
.st-search-row button:disabled { opacity: 0.5; cursor: not-allowed; }
.engine-badge {
  font-size: 0.72rem; padding: 1px 7px; border-radius: 4px; margin-left: 4px;
  background: var(--accent); color: var(--primary);
}
.engine-badge.fts5 { background: #e8e8e8; color: #666; }
.main { max-width: 900px; margin: 0 auto; padding: 20px; }
.result-count { font-size: 0.85rem; color: var(--text-muted); margin-bottom: 12px; }
.result-item {
  background: var(--card-bg); border: 1px solid var(--border); border-radius: var(--radius);
  padding: 14px 18px; margin-bottom: 10px;
}
.result-meta { font-size: 0.8rem; color: var(--text-muted); margin-bottom: 6px; display: flex; gap: 10px; flex-wrap: wrap; }
.result-meta .badge { background: var(--accent); padding: 1px 8px; border-radius: 4px; color: var(--primary); }
.result-title { font-weight: 600; font-size: 0.95rem; margin-bottom: 4px; }
.result-text { font-size: 0.88rem; color: #444; max-height: 4.5em; overflow: hidden; }
.result-actions { margin-top: 8px; display: flex; gap: 8px; }
.result-actions a, .result-actions button {
  font-size: 0.78rem; padding: 2px 10px; border: 1px solid var(--border);
  border-radius: 4px; text-decoration: none; white-space: nowrap; background: var(--card-bg);
  cursor: pointer; color: var(--text); font-family: inherit;
}
.result-actions a:hover, .result-actions button:hover { background: var(--accent); text-decoration: none; }
.no-results { text-align: center; padding: 40px; color: var(--text-muted); }
.coll-hint { padding: 20px; text-align: center; color: var(--text-muted); font-size: 0.88rem; }
.doc-group {
  background: var(--card-bg); border: 1px solid var(--border); border-radius: var(--radius);
  margin-bottom: 10px;
}
.doc-group-head {
  display: flex; align-items: center; gap: 10px; padding: 10px 14px;
  cursor: pointer; flex-wrap: wrap;
}
.doc-group-head:hover { background: var(--accent); }
.doc-group-head .dg-title {
  flex: 1; min-width: 200px; font-weight: 600; font-size: 0.92rem;
  overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
}
.doc-group-head .dg-count {
  font-size: 0.78rem; background: var(--accent); color: var(--primary);
  padding: 1px 8px; border-radius: 4px; white-space: nowrap;
}
.doc-group-head .dg-toggle { color: var(--text-muted); font-size: 0.85rem; width: 1em; flex-shrink: 0; }
.doc-group-body { padding: 0 12px 12px; display: none; }
.doc-group-body .result-item { margin-bottom: 8px; }
.load-more {
  display: block; margin: 8px auto 0; padding: 4px 16px; font-size: 0.8rem;
  border: 1px solid var(--border); border-radius: 4px; background: var(--card-bg);
  color: var(--text); cursor: pointer; font-family: inherit;
}
.load-more:hover { background: var(--accent); }
</style>
</head>
<body data-page="search">
{% include '_nav.html' %}
<div class="main">
  <div class="search-toolbar">
    <div class="st-search-row">
      <input type="text" id="searchInput" placeholder="输入搜索词..." autocomplete="off" value="{{ q }}">
      <select id="searchMode" title="搜索模式">
        <option value="fts5">关键词 (FTS5)</option>
        <option value="sag">语义 (SAG)</option>
      </select>
      <button type="button" id="searchBtn" onclick="doSearch()">搜索</button>
    </div>
  </div>
  <div id="resultCount" class="result-count"></div>
  <div id="results">
    {% if not collection %}
    <div class="coll-hint">请先在导航栏选择一个书架</div>
    {% endif %}
  </div>
</div>

{% include '_preview_modal.html' %}

<script src="/static/nav.js?v={{ static_v }}"></script>
<script src="/static/preview-modal.js?v={{ static_v }}"></script>
<script>
var currentCollection = {{ collection | tojson }};
var currentQuery = {{ q | tojson }};
var highlightTerms = {{ highlight_terms | tojson }};

function escapeHtml(s){var d=document.createElement('div');d.textContent=s||'';return d.innerHTML;}
function attrEsc(s){return String(s==null?'':s).replace(/&/g,'&amp;').replace(/"/g,'&quot;');}

async function doSearch(){
  var q=document.getElementById('searchInput').value.trim();
  if(!q||!currentCollection) return;
  currentQuery=q;
  var mode=document.getElementById('searchMode').value;
  if(mode==='fts5'){ doFtsSearch(q); } else { doSagSearch(q); }
}

// ── FTS5: 按文档分组视图 ───────────────────────────────

var groupData=[];

async function doFtsSearch(q){
  var btn=document.getElementById('searchBtn');
  btn.disabled=true;btn.textContent='搜索中...';
  document.getElementById('resultCount').textContent='';
  document.getElementById('results').innerHTML='';
  var base='/collections/'+encodeURIComponent(currentCollection)+'/';
  try{
    var res=await fetch(base+'search-grouped?'+new URLSearchParams({q:q}));
    var data=await res.json();
    if(data.error){throw new Error(data.error);}
    renderGroups(data);
    if(data.groups&&data.groups.length){ toggleGroup(0,true); }
  }catch(e){
    document.getElementById('results').innerHTML='<div class="no-results">搜索出错: '+escapeHtml(e.message)+'</div>';
  }finally{
    btn.disabled=false;btn.textContent='搜索';
  }
}

function renderGroups(data){
  var countEl=document.getElementById('resultCount');
  var container=document.getElementById('results');
  if(!data.groups||!data.groups.length){
    countEl.innerHTML='<span class="engine-badge fts5">FTS5</span>';
    container.innerHTML='<div class="no-results">未找到匹配结果</div>';
    return;
  }
  var truncNote=data.groups_truncated?'（命中文献超过 '+data.groups.length+' 篇，仅列前 '+data.groups.length+' 篇）':'';
  countEl.innerHTML='共命中 '+data.total_blocks+' 块 · '+data.total_docs+' 篇文献 '+
    truncNote+'<span class="engine-badge fts5">FTS5</span>';
  container.innerHTML='';
  groupData=data.groups.map(function(g){
    return {doc_id:g.doc_id,title:g.title||g.filename,cite_key:g.cite_key,
            hit_count:g.hit_count,loaded:0};
  });
  groupData.forEach(function(g,i){ container.appendChild(buildGroupEl(i)); });
}

function buildGroupEl(i){
  var g=groupData[i];
  var div=document.createElement('div');
  div.className='doc-group';
  div.innerHTML=
    '<div class="doc-group-head" id="dgh'+i+'" onclick="toggleGroup('+i+')">'+
      '<span class="dg-toggle">▸</span>'+
      '<span class="dg-title" title="'+attrEsc(g.title)+'">'+escapeHtml(g.title||('文档 #'+g.doc_id))+'</span>'+
      (g.cite_key?'<span class="badge">['+escapeHtml(g.cite_key)+']</span>':'')+
      '<span class="dg-count">'+g.hit_count+' 块命中</span>'+
    '</div>'+
    '<div class="doc-group-body" id="dgb'+i+'" style="display:none"><div id="dgl'+i+'"></div></div>';
  return div;
}

function toggleGroup(i,forceOpen){
  var g=groupData[i]; if(!g) return;
  var body=document.getElementById('dgb'+i);
  var arrow=document.querySelector('#dgh'+i+' .dg-toggle');
  var open=forceOpen?true:(body.style.display==='none');
  body.style.display=open?'block':'none';
  arrow.textContent=open?'▾':'▸';
  if(open&&g.loaded===0){ loadGroupBlocks(i); }
}

async function loadGroupBlocks(i){
  var g=groupData[i];
  var btn=document.getElementById('dgm'+i);
  if(btn)btn.disabled=true;
  var base='/collections/'+encodeURIComponent(currentCollection)+'/';
  var params=new URLSearchParams({q:currentQuery,doc_id:g.doc_id,limit:20,offset:g.loaded});
  try{
    var res=await fetch(base+'search?'+params);
    var data=await res.json();
    if(data.error){throw new Error(data.error);}
    var list=document.getElementById('dgl'+i);
    (data.results||[]).forEach(function(r){ list.appendChild(buildBlockItem(r)); });
    g.loaded+=(data.results||[]).length;
    var more=document.getElementById('dgm'+i);
    if(data.has_more){
      if(!more){
        more=document.createElement('button');
        more.type='button';more.className='load-more';more.id='dgm'+i;
        more.setAttribute('onclick','loadGroupBlocks('+i+')');
        document.getElementById('dgb'+i).appendChild(more);
      }
      more.textContent='加载更多 ('+g.loaded+'/'+data.total+')';
      more.disabled=false;
    }else if(more){ more.remove(); }
  }catch(e){
    var el=document.getElementById('dgl'+i);
    if(el){ el.innerHTML='<div class="no-results">加载出错: '+escapeHtml(e.message)+'</div>'; }
    if(btn){ btn.disabled=false; }
  }
}

function buildBlockItem(r){
  var div=document.createElement('div');
  div.className='result-item';
  var preview=r.text&&r.text.length>300?r.text.slice(0,300)+'...':(r.text||'');
  var collEnc=encodeURIComponent(currentCollection);
  var meta='<div class="result-meta">'+
      (r.page_num?'<span>第 '+r.page_num+' 页 / 段 '+r.block_num+'</span>':'')+
      (r.score!=null?'<span>score '+Number(r.score).toFixed(3)+'</span>':'')+
    '</div>';
  var actions='<div class="result-actions">';
  if(r.page_num){
    var proofUrl='/collections/'+collEnc+'/doc/'+r.doc_id+'/proofread?page='+r.page_num+'&keyword='+encodeURIComponent(currentQuery)+'&block='+r.block_num;
    if(r.line_id)proofUrl+='&line='+r.line_id;
    actions+='<a href="'+proofUrl+'" target="_blank">校对</a>';
  }
  actions+='<button type="button" onclick="pmOpen('+attrEsc(JSON.stringify(currentCollection))+','+r.doc_id+','+(r.page_num?('{pageNum:'+r.page_num+',blockNum:'+r.block_num+',highlightTerms:highlightTerms}'):'{highlightTerms:highlightTerms}')+',title:'+attrEsc(JSON.stringify(r.title||''))+'})">预览</button></div>';
  div.innerHTML=
    meta+
    '<div class="result-text">'+preview+'</div>'+
    actions;
  return div;
}

// ── SAG: 原扁平视图 ────────────────────────────────────

async function doSagSearch(q){
  var btn=document.getElementById('searchBtn');
  btn.disabled=true;btn.textContent='搜索中...';
  document.getElementById('resultCount').textContent='';
  document.getElementById('results').innerHTML='';
  var base='/collections/'+encodeURIComponent(currentCollection)+'/';
  try{
    var res=await fetch(base+'sag-search?mode=vector&'+new URLSearchParams({q:q,limit:10}));
    var data=await res.json();
    renderResults(data,'sag');
  }catch(e){
    document.getElementById('results').innerHTML='<div class="no-results">搜索出错: '+escapeHtml(e.message)+'</div>';
  }finally{
    btn.disabled=false;btn.textContent='搜索';
  }
}

function renderResults(data,requestedMode){
  var countEl=document.getElementById('resultCount');
  var container=document.getElementById('results');
  if(!data.results||data.results.length===0){
    countEl.textContent='';
    container.innerHTML='<div class="no-results">未找到匹配结果</div>';
    return;
  }
  var engine=data.engine||'fts5';
  var engineLabel=(engine==='sag')?'SAG 语义':'FTS5'+((requestedMode==='sag'&&engine==='fts5')?' (降级)':'');
  countEl.innerHTML='找到 '+data.count+' 条结果 <span class="engine-badge '+engine+'">'+engineLabel+'</span>';
  container.innerHTML='';
  for(var i=0;i<data.results.length;i++){
    container.appendChild(buildBlockItem(data.results[i]));
  }
}

document.getElementById('searchInput').addEventListener('keydown',function(e){
  if(e.key==='Enter')doSearch();
});

if(currentQuery&&currentCollection){
  document.getElementById('searchInput').value=currentQuery;
  doSearch();
}

// SAG 可用性: 不可用则禁用语义选项 (提示降级)
(function(){
  fetch('/api/sag-status').then(function(r){return r.json();}).then(function(s){
    var opt=document.querySelector('#searchMode option[value="sag"]');
    if(s&&!s.healthy){
      opt.disabled=true;
      opt.textContent='语义 (SAG 不可用)';
    }
  }).catch(function(){});
})();
</script>
</body>
</html>
