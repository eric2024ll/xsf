<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="icon" href="/favicon.ico">
<title>搜索 — 小書房</title>
<link rel="stylesheet" href="/static/app.css?v={{ static_v }}">
<style>
.search-toolbar {
  display: block; padding: 10px 14px; margin-bottom: 12px;
  background: var(--card-bg); border: 1px solid var(--border); border-radius: var(--radius);
}
.st-search-row {
  display: flex; gap: 8px; align-items: center;
}
.st-search-row input[type="text"] {
  flex: 1; min-width: 120px; padding: 7px 12px; border: 1px solid var(--border);
  border-radius: var(--radius); font-size: 0.9rem; outline: none;
}
.st-search-row input[type="text"]:focus { border-color: var(--primary); }
.st-search-row select {
  padding: 7px 10px; border: 1px solid var(--border); border-radius: var(--radius);
  font-size: 0.85rem; background: var(--card-bg); color: var(--text); cursor: pointer; flex-shrink: 0;
}
.st-search-row button {
  padding: 7px 20px; background: var(--primary); color: #fff; border: none;
  border-radius: var(--radius); cursor: pointer; font-size: 0.9rem; font-weight: 600; flex-shrink: 0;
}
.st-search-row button:hover { background: var(--primary-hover); }
.st-search-row button:disabled { opacity: 0.5; cursor: not-allowed; }
.engine-badge {
  font-size: 0.72rem; padding: 1px 7px; border-radius: 4px; margin-left: 4px;
  background: var(--accent); color: var(--primary);
}
.engine-badge.fts5 { background: #e8e8e8; color: #666; }
.main { max-width: 900px; margin: 0 auto; padding: 20px; }
.result-count { font-size: 0.85rem; color: var(--text-muted); margin-bottom: 12px; }
.result-item {
  background: var(--card-bg); border: 1px solid var(--border); border-radius: var(--radius);
  padding: 14px 18px; margin-bottom: 10px;
}
.result-meta { font-size: 0.8rem; color: var(--text-muted); margin-bottom: 6px; display: flex; gap: 10px; flex-wrap: wrap; }
.result-meta .badge { background: var(--accent); padding: 1px 8px; border-radius: 4px; color: var(--primary); }
.result-title { font-weight: 600; font-size: 0.95rem; margin-bottom: 4px; }
.result-text { font-size: 0.88rem; color: #444; max-height: 4.5em; overflow: hidden; }
.result-actions { margin-top: 8px; display: flex; gap: 8px; }
.result-actions a, .result-actions button {
  font-size: 0.78rem; padding: 2px 10px; border: 1px solid var(--border);
  border-radius: 4px; text-decoration: none; white-space: nowrap; background: var(--card-bg);
  cursor: pointer; color: var(--text); font-family: inherit;
}
.result-actions a:hover, .result-actions button:hover { background: var(--accent); text-decoration: none; }
.no-results { text-align: center; padding: 40px; color: var(--text-muted); }
.coll-hint { padding: 20px; text-align: center; color: var(--text-muted); font-size: 0.88rem; }
.doc-group {
  background: var(--card-bg); border: 1px solid var(--border); border-radius: var(--radius);
  margin-bottom: 10px;
}
.doc-group-head {
  display: flex; align-items: center; gap: 10px; padding: 10px 14px;
  cursor: pointer; flex-wrap: wrap;
}
.doc-group-head:hover { background: var(--accent); }
.doc-group-head .dg-title {
  flex: 1; min-width: 200px; font-weight: 600; font-size: 0.92rem;
  overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
}
.doc-group-head .dg-count {
  font-size: 0.78rem; background: var(--accent); color: var(--primary);
  padding: 1px 8px; border-radius: 4px; white-space: nowrap;
}
.doc-group-head .dg-toggle { color: var(--text-muted); font-size: 0.85rem; width: 1em; flex-shrink: 0; }
.doc-group-body { padding: 0 12px 12px; display: none; }
.doc-group-body .result-item { margin-bottom: 8px; }
.load-more {
  display: block; margin: 8px auto 0; padding: 4px 16px; font-size: 0.8rem;
  border: 1px solid var(--border); border-radius: 4px; background: var(--card-bg);
  color: var(--text); cursor: pointer; font-family: inherit;
}
.load-more:hover { background: var(--accent); }
</style>
</head>
<body data-page="search">
{% include '_nav.html' %}
<div class="main">
  <div class="search-toolbar">
    <div class="st-search-row">
      <input type="text" id="searchInput" placeholder="输入搜索词..." autocomplete="off" value="{{ q }}">
      <button type="button" id="searchBtn" onclick="doSearch()">搜索</button>
      <button type="button" onclick="toggleStats()" title="检索效用统计">统计</button>
    </div>
    <div class="st-filter-row" style="display:flex;gap:8px;margin-top:8px;align-items:center;font-size:0.82rem;flex-wrap:wrap;">
      <label>块范围
        <select id="fLabel" style="padding:3px 6px;">
          <option value="exclude" selected>剔页眉页码</option>
          <option value="text">仅正文</option>
          <option value="all">全部</option>
        </select>
      </label>
      <label>来源
        <select id="fSource" style="padding:3px 6px;">
          <option value="" selected>全部</option>
          <option value="primary">一手史料</option>
          <option value="secondary">研究文献</option>
          <option value="reference">工具书</option>
        </select>
      </label>
      <label>年份
        <input type="number" id="fYearFrom" placeholder="起" style="width:64px;padding:3px 6px;" title="仅对已填年份(bib_data)的文献生效">
        –
        <input type="number" id="fYearTo" placeholder="止" style="width:64px;padding:3px 6px;" title="仅对已填年份(bib_data)的文献生效">
      </label>
    </div>
    <div id="statsSec" style="display:none;margin-top:10px;padding-top:10px;border-top:1px dashed var(--border);font-size:0.82rem;color:var(--text-muted);">加载中…</div>
  </div>
  <div id="resultCount" class="result-count"></div>
  <div id="results">
    {% if not collection %}
    <div class="coll-hint">请先在导航栏选择一个书架</div>
    {% endif %}
  </div>
</div>

{% include '_preview_modal.html' %}

<script src="/static/nav.js?v={{ static_v }}"></script>
<script src="/static/preview-modal.js?v={{ static_v }}"></script>
<script>
var currentCollection = {{ collection | tojson }};
var currentQuery = {{ q | tojson }};
var highlightTerms = {{ highlight_terms | tojson }};

function escapeHtml(s){var d=document.createElement('div');d.textContent=s||'';return d.innerHTML;}
function attrEsc(s){return String(s==null?'':s).replace(/&/g,'&amp;').replace(/"/g,'&quot;');}

async function doSearch(){
  var q=document.getElementById('searchInput').value.trim();
  if(!q||!currentCollection) return;
  currentQuery=q;
  doFtsSearch(q);
}

// ── FTS5: 按文档分组视图 ───────────────────────────────

var groupData=[];
var __eventId=null, __clickedSent=false;

function recordClick(){
  if(!__eventId||__clickedSent) return;
  __clickedSent=true;
  fetch('/collections/'+encodeURIComponent(currentCollection)+
        '/search-events/'+__eventId+'/click',{method:'POST'}).catch(function(){});
}

async function toggleStats(){
  var el=document.getElementById('statsSec');
  if(el.style.display==='block'){el.style.display='none';return;}
  el.style.display='block';el.textContent='加载中…';
  try{
    var r=await fetch('/collections/'+encodeURIComponent(currentCollection)+'/search-stats');
    var d=await r.json();
    if(d.error){throw new Error(d.error);}
    function pct(x){return x==null?'—':(x*100).toFixed(1)+'%';}
    el.innerHTML='近 <b>'+d.searches+'</b> 次检索 · 点击率 <b>'+pct(d.ctr)+
      '</b> · 实体命中时 <b>'+pct(d.ctr_with_entity)+
      '</b>（'+d.with_entity+' 次） · 无实体时 <b>'+pct(d.ctr_without_entity)+
      '</b> · 提升度 <b>'+(d.entity_lift==null?'—':(d.entity_lift*100).toFixed(1)+'pp')+
      '</b> · 零命中 '+d.zero_hit;
  }catch(e){
    el.textContent='统计加载失败: '+e.message;
  }
}

// ── A2 过滤器 (2026-11-05): 块范围 / 来源 / 年份 ──
// 默认「剔页眉页码」: 乡土志系正文标签是 vertical_text, 仅正文模式须含二者
function filterParams(){
  var p={};
  var m=document.getElementById('fLabel').value;
  if(m==='exclude') p.exclude='header,page_number,footer,number';
  else if(m==='text') p.label='text,vertical_text';
  var s=document.getElementById('fSource').value;
  if(s) p.source_type=s;
  var yf=document.getElementById('fYearFrom').value;
  var yt=document.getElementById('fYearTo').value;
  if(yf) p.year_from=yf;
  if(yt) p.year_to=yt;
  return p;
}

async function doFtsSearch(q){
  var btn=document.getElementById('searchBtn');
  btn.disabled=true;btn.textContent='搜索中...';
  document.getElementById('resultCount').textContent='';
  document.getElementById('results').innerHTML='';
  var base='/collections/'+encodeURIComponent(currentCollection)+'/';
  try{
    var ps=new URLSearchParams({q:q});
    Object.entries(filterParams()).forEach(function(kv){ps.append(kv[0],kv[1]);});
    var res=await fetch(base+'search-grouped?'+ps);
    var data=await res.json();
    if(data.error){throw new Error(data.error);}
    renderGroups(data);
    if(data.groups&&data.groups.length){ toggleGroup(0,true); }
  }catch(e){
    document.getElementById('results').innerHTML='<div class="no-results">搜索出错: '+escapeHtml(e.message)+'</div>';
  }finally{
    btn.disabled=false;btn.textContent='搜索';
  }
}

function renderGroups(data){
  __eventId=data.event_id||null; __clickedSent=false;
  var countEl=document.getElementById('resultCount');
  var container=document.getElementById('results');
  container.innerHTML='';
  if(!data.groups||!data.groups.length){
    countEl.innerHTML='<span class="engine-badge fts5">FTS5</span>';
    container.innerHTML='<div class="no-results">未找到匹配结果<br><span style="font-size:0.8rem;color:var(--text-muted);">已记入检索问题库；可在「实体图谱」页为相关实体补充别名后重试</span></div>';
    return;
  }
  var truncNote=data.groups_truncated?'（命中文献超过 '+data.groups.length+' 篇，仅列前 '+data.groups.length+' 篇）':'';
  countEl.innerHTML='共命中 '+data.total_blocks+' 块 · '+data.total_docs+' 篇文献 '+
    truncNote+'<span class="engine-badge fts5">FTS5</span>';
  if(data.expanded){
    var expParts=[];
    Object.keys(data.expanded).forEach(function(k){
      var vs=data.expanded[k]||[];
      if(vs.length) expParts.push(k+' → '+vs.join(' / '));
    });
    if(expParts.length){
      var eh=document.createElement('div');
      eh.style.cssText='font-size:0.8rem;color:var(--text-muted);margin:4px 0 0;';
      eh.textContent='已按实体别名扩展：'+expParts.join('；');
      countEl.parentNode.insertBefore(eh, countEl.nextSibling);
    }
  }
  if(data.entities&&data.entities.length){
    var eb=document.createElement('div');
    eb.className='doc-group';
    eb.innerHTML='<div class="doc-group-head"><span class="dg-title">实体命中（'+data.entities.length+'）</span></div>'+
      '<div class="doc-group-body" style="display:block;padding:6px 10px;">'+
      data.entities.map(function(e){
        return '<a class="eg-hit" style="display:inline-block;margin:2px 8px 2px 0;color:var(--primary);cursor:pointer;" '+
          'onclick="openEntity('+e.id+')">'+escapeHtml(e.canonical)+
          (e.category?' <span style="color:var(--text-muted);font-size:0.78rem;">'+escapeHtml(e.category)+'</span>':'')+
          ' <span style="color:var(--text-muted);font-size:0.78rem;">·'+e.mentions+'</span></a>';
      }).join('')+'</div>';
    container.appendChild(eb);
  }
  if(data.annotations&&data.annotations.length){
    var ab=document.createElement('div');
    ab.className='doc-group';
    ab.innerHTML='<div class="doc-group-head"><span class="dg-title">批注命中（'+data.annotations.length+'）</span></div>'+
      '<div class="doc-group-body" style="display:block;padding:6px 10px;">'+
      data.annotations.map(function(a){
        var txt=(a.note||'')||a.clip_text||'';
        return '<a class="rc-hit" style="display:block;margin:3px 0;color:inherit;text-decoration:none;" href="/collections/'+
          encodeURIComponent(currentCollection)+'/doc/'+a.doc_id+'/proofread?page='+a.page_num+'">'+
          '<b>'+escapeHtml(a.title||('文档#'+a.doc_id))+'</b>'+
          ' <span style="color:var(--text-muted);font-size:0.78rem;">第 '+a.page_num+' 页'+
          (a.origin==='ai'?' · AI批注':' · 批注')+'</span>'+
          '<div style="color:var(--text-muted);font-size:0.78rem;">'+escapeHtml(String(txt).slice(0,100))+'</div></a>';
      }).join('')+'</div>';
    container.appendChild(ab);
  }
  groupData=data.groups.map(function(g){
    return {doc_id:g.doc_id,title:g.title||g.filename,cite_key:g.cite_key,
            hit_count:g.hit_count,loaded:0};
  });
  groupData.forEach(function(g,i){ container.appendChild(buildGroupEl(i)); });
}

function openEntity(id){
  window.location='/collections/'+encodeURIComponent(currentCollection)+'/entities/view?id='+id;
}

function buildGroupEl(i){
  var g=groupData[i];
  var div=document.createElement('div');
  div.className='doc-group';
  div.innerHTML=
    '<div class="doc-group-head" id="dgh'+i+'" onclick="toggleGroup('+i+')">'+
      '<span class="dg-toggle">▸</span>'+
      '<span class="dg-title" title="'+attrEsc(g.title)+'">'+escapeHtml(g.title||('文档 #'+g.doc_id))+'</span>'+
      (g.cite_key?'<span class="badge">['+escapeHtml(g.cite_key)+']</span>':'')+
      '<span class="dg-count">'+g.hit_count+' 块命中</span>'+
    '</div>'+
    '<div class="doc-group-body" id="dgb'+i+'" style="display:none"><div id="dgl'+i+'"></div></div>';
  return div;
}

function toggleGroup(i,forceOpen){
  var g=groupData[i]; if(!g) return;
  var body=document.getElementById('dgb'+i);
  var arrow=document.querySelector('#dgh'+i+' .dg-toggle');
  var open=forceOpen?true:(body.style.display==='none');
  body.style.display=open?'block':'none';
  arrow.textContent=open?'▾':'▸';
  if(open&&g.loaded===0){ loadGroupBlocks(i); }
}

async function loadGroupBlocks(i){
  var g=groupData[i];
  var btn=document.getElementById('dgm'+i);
  if(btn)btn.disabled=true;
  var base='/collections/'+encodeURIComponent(currentCollection)+'/';
  var params=new URLSearchParams({q:currentQuery,doc_id:g.doc_id,limit:20,offset:g.loaded});
  Object.entries(filterParams()).forEach(function(kv){params.append(kv[0],kv[1]);});
  try{
    var res=await fetch(base+'search?'+params);
    var data=await res.json();
    if(data.error){throw new Error(data.error);}
    var list=document.getElementById('dgl'+i);
    (data.results||[]).forEach(function(r){ list.appendChild(buildBlockItem(r)); });
    g.loaded+=(data.results||[]).length;
    var more=document.getElementById('dgm'+i);
    if(data.has_more){
      if(!more){
        more=document.createElement('button');
        more.type='button';more.className='load-more';more.id='dgm'+i;
        more.setAttribute('onclick','loadGroupBlocks('+i+')');
        document.getElementById('dgb'+i).appendChild(more);
      }
      more.textContent='加载更多 ('+g.loaded+'/'+data.total+')';
      more.disabled=false;
    }else if(more){ more.remove(); }
  }catch(e){
    var el=document.getElementById('dgl'+i);
    if(el){ el.innerHTML='<div class="no-results">加载出错: '+escapeHtml(e.message)+'</div>'; }
    if(btn){ btn.disabled=false; }
  }
}

function buildBlockItem(r){
  var div=document.createElement('div');
  div.className='result-item';
  var preview=r.text&&r.text.length>300?r.text.slice(0,300)+'...':(r.text||'');
  var collEnc=encodeURIComponent(currentCollection);
  var meta='<div class="result-meta">'+
      (r.page_num?'<span>第 '+r.page_num+' 页 / 段 '+r.block_num+'</span>':'')+
      (r.score!=null?'<span>score '+Number(r.score).toFixed(3)+'</span>':'')+
    '</div>';
  var actions='<div class="result-actions">';
  if(r.page_num){
    var proofUrl='/collections/'+collEnc+'/doc/'+r.doc_id+'/proofread?page='+r.page_num+'&keyword='+encodeURIComponent(currentQuery)+'&block='+r.block_num;
    if(r.line_id)proofUrl+='&line='+r.line_id;
    actions+='<a href="'+proofUrl+'" target="_blank" onclick="recordClick()">校对</a>';
  }
  actions+='<button type="button" onclick="recordClick();pmOpen('+attrEsc(JSON.stringify(currentCollection))+','+r.doc_id+','+(r.page_num?('{pageNum:'+r.page_num+',blockNum:'+r.block_num+','):'{')+'highlightTerms:highlightTerms,title:'+attrEsc(JSON.stringify(r.title||''))+'})">预览</button></div>';
  div.innerHTML=
    meta+
    '<div class="result-text">'+preview+'</div>'+
    actions;
  return div;
}

document.getElementById('searchInput').addEventListener('keydown',function(e){
  if(e.key==='Enter')doSearch();
});

if(currentQuery&&currentCollection){
  document.getElementById('searchInput').value=currentQuery;
  doSearch();
}
// 过滤器变更即时重查 (有活动查询时)
['fLabel','fSource','fYearFrom','fYearTo'].forEach(function(id){
  document.getElementById(id).addEventListener('change',function(){
    if(currentQuery&&currentCollection) doSearch();
  });
});
</script>
</body>
</html>
