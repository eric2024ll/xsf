<nav class="top-nav">
  <a class="brand" href="/">小書房</a>
  <button class="nav-hamburger" id="hamburgerBtn" aria-label="菜单">
    <span class="ham-line"></span>
    <span class="ham-line"></span>
    <span class="ham-line"></span>
  </button>
  <span class="nav-current-coll" id="navCurrentColl">{% if collection %}当前书架：{{ collection }}{% endif %}</span>
  <input type="text" class="nav-search" id="navSearch"
         placeholder="搜索文献…" autocomplete="off"
         aria-label="搜索文献">
  <div class="nav-dropdown" id="navDropdown">
    <div class="nd-section">
      <select id="ndCollection" onchange="switchCollection(this.value)" title="切换书架">
        {% for c in collections %}
        <option value="{{ c }}" {% if c == collection %}selected{% endif %}>{{ c }}</option>
        {% endfor %}
      </select>
    </div>
    <div class="nd-divider"></div>
    <div class="nd-section">
      <a href="/" class="nd-item {{ 'active' if active_nav == 'bookshelf' else '' }}">书架</a>
      <a href="{{ '/search?c=' + collection if collection else '/search' }}"
         class="nd-item {{ 'active' if active_nav == 'search' else '' }}">搜索</a>
      {% if collection %}
      <a href="/collections/{{ collection }}/docs/list"
         class="nd-item {{ 'active' if active_nav == 'docs' else '' }}">文献列表</a>
      <a href="/collections/{{ collection }}/upload"
         class="nd-item {{ 'active' if active_nav == 'upload' else '' }}">资料上传</a>
      {% else %}
      <span class="nd-item disabled">文献列表</span>
      <span class="nd-item disabled">资料上传</span>
      {% endif %}
    </div>
  </div>
</nav>
<script>
window.NAV_COLLECTION = {{ collection | tojson }};
window.NAV_COLLECTIONS = {{ collections | tojson }};
(function () {
  // ── 导航搜索 ──
  var input = document.getElementById('navSearch');
  if (input) {
    input.addEventListener('keydown', function (e) {
      if (e.key !== 'Enter') return;
      var q = input.value.trim();
      if (!q) return;
      var c = window.NAV_COLLECTION || '';
      location.href = '/search?c=' + encodeURIComponent(c) + '&q=' + encodeURIComponent(q);
    });
  }

  // ── 汉堡菜单 ──
  var hamburger = document.getElementById('hamburgerBtn');
  var dropdown = document.getElementById('navDropdown');
  if (hamburger && dropdown) {
    function toggleNavMenu() {
      var show = dropdown.classList.toggle('show');
      hamburger.classList.toggle('open', show);
    }
    hamburger.addEventListener('click', function (e) {
      e.stopPropagation();
      toggleNavMenu();
    });
    document.addEventListener('click', function () {
      dropdown.classList.remove('show');
      hamburger.classList.remove('open');
    });
    dropdown.addEventListener('click', function (e) {
      e.stopPropagation();
    });
  }

  // ── 切换书架 ──
  window.switchCollection = function (c) {
    location.href = '/search?c=' + encodeURIComponent(c);
  };

  // ── 导航高度同步 (body padding 兜底) ──
  function syncNavH() {
    var nav = document.querySelector('.top-nav');
    if (!nav) return;
    var h = nav.offsetHeight + 'px';
    document.documentElement.style.setProperty('--nav-h', h);
    document.body.style.paddingTop = h;
  }
  window.addEventListener('resize', syncNavH);
  syncNavH();
})();
</script>
