<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="icon" href="/favicon.ico">
<title>小書房 — 书架</title>
<link rel="stylesheet" href="/static/app.css?v={{ static_v }}">
<style>
.main { max-width: 1100px; margin: 0 auto; padding: 20px; }
.section-title { font-size: 1rem; font-weight: 700; margin-bottom: 12px; color: var(--text); }
.stats-grid {
  display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; margin-bottom: 24px;
}
.stat-card {
  background: var(--card-bg); border: 1px solid var(--border);
  border-radius: var(--radius); padding: 16px; text-align: center;
}
.stat-card .num { font-size: 1.5rem; font-weight: 700; color: var(--primary); }
.stat-card .label { font-size: 0.75rem; color: var(--text-muted); margin-top: 4px; }
.coll-table {
  background: var(--card-bg); border: 1px solid var(--border);
  border-radius: var(--radius); overflow: hidden; margin-bottom: 24px;
}
.coll-table table { width: 100%; border-collapse: collapse; font-size: 0.88rem; }
.coll-table th { background: var(--accent); color: var(--primary); padding: 10px 14px; text-align: left; font-weight: 600; }
.coll-table td { padding: 10px 14px; border-top: 1px solid var(--border); }
.coll-table tr:hover td { background: #fafafa; }
.coll-table td .coll-link { font-weight: 600; }
.coll-act { padding: 2px 8px; font-size: 0.78rem; }
.coll-del { color: #c0392b; }
.doc-list { background: var(--card-bg); border: 1px solid var(--border); border-radius: var(--radius); overflow: hidden; }
.doc-list table { width: 100%; border-collapse: collapse; font-size: 0.85rem; }
.doc-list th { background: var(--accent); color: var(--primary); padding: 8px 14px; text-align: left; font-weight: 600; }
.doc-list td { padding: 8px 14px; border-top: 1px solid var(--border); }
.doc-list tr:hover td { background: #fafafa; }
.doc-title-cell { font-weight: 600; }
.doc-coll-badge {
  display: inline-block; padding: 1px 8px; border-radius: 4px;
  font-size: 0.72rem; background: var(--accent); color: var(--primary);
}
.empty-hint { padding: 30px; text-align: center; color: var(--text-muted); font-size: 0.88rem; }
.resume-banner {
  display: flex; align-items: center; gap: 12px;
  background: linear-gradient(90deg, var(--accent), #fff);
  border: 1px solid var(--border); border-left: 4px solid var(--primary);
  border-radius: var(--radius); padding: 14px 18px; margin-bottom: 24px;
}
.resume-banner .resume-icon { font-size: 1.4rem; }
.resume-banner .resume-text { font-size: 0.95rem; color: var(--text); flex: 1; }
.resume-banner .resume-text strong { color: var(--primary); font-size: 1.05rem; }
.resume-banner .resume-btn { padding: 6px 16px; font-weight: 600; white-space: nowrap; }
.coll-last-badge {
  display: inline-block; padding: 1px 7px; border-radius: 4px; margin-left: 6px;
  font-size: 0.7rem; background: var(--primary); color: #fff;
}
/* ── 书架级导入导出 (2026-11-11) ── */
.shelf-prog {
  display: flex; align-items: center; gap: 10px;
  background: var(--card-bg); border: 1px solid var(--border);
  border-radius: var(--radius); padding: 10px 14px; margin-bottom: 12px;
}
.shelf-prog .sp-label { font-size: 0.85rem; color: var(--text); flex: 1; min-width: 0;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.shelf-prog .sp-bar { width: 180px; height: 8px; background: var(--accent);
  border-radius: 4px; overflow: hidden; flex-shrink: 0; }
.shelf-prog .sp-bar div { height: 100%; background: var(--primary); width: 0; transition: width .4s; }
.shelf-modal-mask { position: fixed; inset: 0; background: rgba(0,0,0,.4);
  display: flex; align-items: center; justify-content: center; z-index: 300; }
.shelf-modal { background: #fff; border-radius: 10px; padding: 22px 26px;
  max-width: 460px; width: 92%; box-shadow: 0 8px 30px rgba(0,0,0,.18); }
.shelf-modal h3 { margin: 0 0 10px; font-size: 1rem; }
.shelf-modal p { font-size: 0.88rem; color: var(--text-muted); margin: 0 0 16px; line-height: 1.6; }
.shelf-modal .sm-btns { display: flex; gap: 10px; flex-wrap: wrap; }
.shelf-modal .sm-btns button { flex: 1; min-width: 100px; padding: 8px 12px; }
.sm-danger { background: #c0392b !important; color: #fff !important; border-color: #c0392b !important; }
@media(max-width:768px){ .stats-grid{grid-template-columns:repeat(2,1fr);} }
</style>
</head>
<body data-page="bookshelf">
{% include '_nav.html' %}
<div class="main">
  <div class="section-title">全库统计</div>
  <div class="stats-grid">
    <div class="stat-card"><div class="num" id="statDocs">-</div><div class="label">文献</div></div>
    <div class="stat-card"><div class="num" id="statLines">-</div><div class="label">行</div></div>
    <div class="stat-card"><div class="num" id="statBlocks">-</div><div class="label">文本块</div></div>
    <div class="stat-card"><div class="num" id="statOcr">-</div><div class="label">OCR</div></div>
  </div>

  <div class="section-title">书架列表</div>
  <div id="shelfProg" class="shelf-prog" style="display:none;">
    <div class="sp-label" id="spLabel"></div>
    <div class="sp-bar"><div id="spFill"></div></div>
  </div>
  <div class="coll-table" id="collTable">
    <div class="empty-hint">加载中…</div>
  </div>
  <input type="file" id="shelfImportInput" accept=".sqcoll,.tar.gz,.gz" style="display:none;">

  <div class="section-title">最近文献</div>
  <div class="doc-list" id="recentDocs">
    <div class="empty-hint">加载中…</div>
  </div>
</div>

{% include '_preview_modal.html' %}

<script src="/static/nav.js?v={{ static_v }}"></script>
<script src="/static/preview-modal.js?v={{ static_v }}"></script>
<script>
window.LAST_COLLECTION = {{ last_collection | tojson }};
function escapeHtml(s){var d=document.createElement('div');d.textContent=s||'';return d.innerHTML;}
function attrEsc(s){return String(s==null?'':s).replace(/&/g,'&amp;').replace(/"/g,'&quot;');}

async function loadStats(){
  try{
    var r=await fetch('/api/stats');var d=await r.json();
    document.getElementById('statDocs').textContent=d.documents??0;
    document.getElementById('statLines').textContent=d.lines??0;
    document.getElementById('statBlocks').textContent=d.blocks??0;
    document.getElementById('statOcr').textContent=d.ocr_docs??0;
    renderColls(d.collections||[]);
  }catch(e){document.getElementById('collTable').innerHTML='<div class="empty-hint">加载失败</div>';}
}

function renderColls(colls){
  var box=document.getElementById('collTable');
  if(!colls.length){
    box.innerHTML='<div class="empty-hint">暂无书架，点击下方「新建书架」</div>'+
      '<div style="padding:12px 14px;"><button class="btn" onclick="newColl()">+ 新建书架</button></div>';
    return;
  }
  var h='<table><thead><tr><th>书架</th><th>文献数</th><th>页数</th><th>操作</th></tr></thead><tbody>';
  var last=window.LAST_COLLECTION||'';
  colls.slice().sort(function(a,b){
    if(a.name===last)return -1; if(b.name===last)return 1; return 0;
  }).forEach(function(c){
    var badge=(c.name===last)?'<span class="coll-last-badge">上次使用</span>':'';
    h+='<tr><td><span class="coll-link">'+escapeHtml(c.name)+'</span>'+badge+'</td>'+
       '<td>'+c.count+'</td><td>'+c.pages+'</td>'+
       '<td><a href="/collections/'+encodeURIComponent(c.name)+'/docs/list">进入</a> · '+
       '<button class="btn coll-act" onclick="renameColl('+attrEsc(JSON.stringify(c.name))+')">改名</button> · '+
       '<button class="btn coll-act" onclick="exportShelf('+attrEsc(JSON.stringify(c.name))+')">导出</button> · '+
       '<button class="btn coll-act coll-del" onclick="deleteColl('+attrEsc(JSON.stringify(c.name))+')">删除</button></td></tr>';
  });
  h+='</tbody><tfoot><tr><td colspan="4"><button class="btn" onclick="newColl()">+ 新建书架</button> '+
     '<button class="btn" onclick="document.getElementById(\'shelfImportInput\').click()">导入书架包…</button></td></tr></tfoot>';
  h+='</table>';
  box.innerHTML=h;
}

// ── 书架级导入导出 (2026-11-11) ──
function spShow(label,pct){
  var box=document.getElementById('shelfProg');
  document.getElementById('spLabel').textContent=label;
  document.getElementById('spFill').style.width=Math.min(100,pct)+'%';
  box.style.display='flex';
}
function spHide(){document.getElementById('shelfProg').style.display='none';}

function pollShelfJob(jid,title,cb){
  var timer=setInterval(async function(){
    try{
      var r=await fetch('/jobs/'+jid);var j=await r.json();
      var p=j.progress||{pct:0,text:''};
      if(j.status==='running')spShow(title+' — '+(p.text||'…'),p.pct);
      else{clearInterval(timer);cb(j);}
    }catch(e){/* 网络抖动继续轮 */}
  },1500);
}

async function exportShelf(name){
  if(!confirm('导出整书架「'+name+'」？\n(数据库+源文件打包为 .sqcoll, 大书架可能需要几分钟)'))return;
  spShow('导出「'+name+'」 — 提交…',2);
  try{
    var r=await fetch('/collections/'+encodeURIComponent(name)+'/export-shelf',{method:'POST'});
    var d=await r.json();
    if(!d.ok){alert(d.error||'导出失败');spHide();return;}
    pollShelfJob(d.job,'导出「'+name+'」',function(j){
      if(j.status==='done'){
        spShow('导出完成 ('+(j.result.size_mb||'?')+' MB), 开始下载…',100);
        window.location.href=j.result.download;
        setTimeout(spHide,3000);
      }else{alert('导出失败: '+(j.error||''));spHide();}
    });
  }catch(e){alert('请求失败: '+e.message);spHide();}
}

document.getElementById('shelfImportInput').addEventListener('change',async function(){
  var f=this.files&&this.files[0];this.value='';
  if(!f)return;
  spShow('上传「'+f.name+'」…',3);
  try{
    var fd=new FormData();fd.append('file',f);
    var r=await fetch('/collections/import-shelf',{method:'POST',body:fd});
    var d=await r.json();
    if(!r.ok){alert(d.error||'导入失败');spHide();return;}
    if(d.exists){
      spHide();
      shelfDecision(d,function(mode){
        if(mode)runShelfImport(d.stage_id,mode,d.collection);else spHide();
      });
    }else{
      runShelfImport(d.stage_id,'create',d.collection);
    }
  }catch(e){alert('上传失败: '+e.message);spHide();}
});

function shelfDecision(d,cb){
  var mask=document.createElement('div');mask.className='shelf-modal-mask';
  mask.innerHTML='<div class="shelf-modal"><h3>书架「'+escapeHtml(d.collection)+'」已存在</h3>'+
    '<p>包内 '+d.pkg_docs+' 篇 (导出于 '+escapeHtml(d.exported_at||'未知时间')+') · '+
    '本机 '+d.local_docs+' 篇。<br>覆盖 = 本机该书架数据整体替换为包内容; '+
    '继续导入 = 只并入本机没有的文献 (同 cite_key 跳过); 放弃 = 取消。</p>'+
    '<div class="sm-btns"><button class="btn sm-danger" data-m="overwrite">覆盖</button>'+
    '<button class="btn" data-m="merge">继续导入</button>'+
    '<button class="btn" data-m="">放弃</button></div></div>';
  mask.addEventListener('click',function(ev){
    if(ev.target===mask){document.body.removeChild(mask);cb('');return;}
    var b=ev.target.closest('button');if(!b)return;
    document.body.removeChild(mask);cb(b.dataset.m||'');
  });
  document.body.appendChild(mask);
}

async function runShelfImport(stageId,mode,coll){
  spShow('导入「'+coll+'」('+mode+') — 提交…',3);
  try{
    var r=await fetch('/collections/import-shelf/'+stageId,{method:'POST',
      headers:{'Content-Type':'application/json'},body:JSON.stringify({mode:mode})});
    var d=await r.json();
    if(!d.ok){alert(d.error||'导入失败');spHide();return;}
    pollShelfJob(d.job,'导入「'+coll+'」',function(j){
      if(j.status==='done'){
        var res=j.result||{};
        alert('导入完成: 并入 '+res.imported+' 篇'+
          (res.skipped?' · 跳过 '+res.skipped+' 篇 (已在架)':''));
        location.reload();
      }else{alert('导入失败: '+(j.error||''));spHide();}
    });
  }catch(e){alert('请求失败: '+e.message);spHide();}
}

async function renameColl(name){
  var newName=prompt('将「'+name+'」重命名为:',name);
  if(!newName||!newName.trim()||newName.trim()===name)return;
  try{
    var r=await fetch('/api/collections/'+encodeURIComponent(name),{method:'PATCH',headers:{'Content-Type':'application/json'},body:JSON.stringify({new_name:newName.trim()})});
    var d=await r.json();
    if(!r.ok){alert(d.error||'重命名失败');return;}
    location.reload();
  }catch(e){alert('请求失败');}
}

async function deleteColl(name){
  if(!confirm('确定删除书架「'+name+'」？此操作不可撤销，所有文献和源文件将被删除。'))return;
  try{
    var r=await fetch('/api/collections/'+encodeURIComponent(name),{method:'DELETE'});
    var d=await r.json();
    if(!r.ok){alert(d.error||'删除失败');return;}
    loadStats();loadRecent();
  }catch(e){alert('请求失败');}
}

async function newColl(){
  var name=prompt('输入新书架名:');
  if(!name||!name.trim())return;
  name=name.trim();
  try{
    var r=await fetch('/api/collections/'+encodeURIComponent(name),{method:'POST'});
    var d=await r.json();
    if(!r.ok){alert(d.error||'创建失败');return;}
    location.href='/collections/'+encodeURIComponent(name)+'/docs/list';
  }catch(e){alert('请求失败');}
}

async function loadRecent(){
  try{
    var colls=window.NAV_COLLECTIONS||[];
    var box=document.getElementById('recentDocs');
    if(!colls.length){box.innerHTML='<div class="empty-hint">暂无文献</div>';return;}
    // 从每个 collection 取最近几条, 合并后按时间排序取前 20
    var all=[];
    for(var i=0;i<colls.length;i++){
      try{
        var r=await fetch('/collections/'+encodeURIComponent(colls[i])+'/docs?limit=5');
        var d=await r.json();
        (d.docs||[]).forEach(function(doc){
          doc._coll=colls[i];all.push(doc);
        });
      }catch(e){}
    }
    all.sort(function(a,b){return (b.created_at||'').localeCompare(a.created_at||'');});
    all=all.slice(0,20);
    if(!all.length){box.innerHTML='<div class="empty-hint">暂无文献</div>';return;}
    var h='<table><thead><tr><th>书架</th><th>标题</th><th>页数</th><th>操作</th></tr></thead><tbody>';
    all.forEach(function(d){
      var t=d.title||d.filename||'(无标题)';
      h+='<tr><td><span class="doc-coll-badge">'+escapeHtml(d._coll)+'</span></td>'+
         '<td class="doc-title-cell">'+escapeHtml(t)+'</td>'+
         '<td>'+(d.page_count||'-')+'</td>'+
         '<td><button class="btn" style="padding:2px 10px;font-size:0.8rem;" onclick="pmOpen('+attrEsc(JSON.stringify(d._coll))+','+d.id+',{title:'+attrEsc(JSON.stringify(t))+'})">预览</button> · '+
         '<a href="/collections/'+encodeURIComponent(d._coll)+'/doc/'+d.id+'/proofread">校对</a></td></tr>';
    });
    h+='</tbody></table>';
    box.innerHTML=h;
  }catch(e){document.getElementById('recentDocs').innerHTML='<div class="empty-hint">加载失败</div>';}
}

loadStats();loadRecent();
</script>
</body>
</html>
