[project]
name = "xsf"
version = "0.1.0"
description = "小書房 — 文献池检索系统"
requires-python = ">=3.11"
dependencies = [
    "PyMuPDF",
    "jieba",
    "requests",
    "fastapi",
    "uvicorn[standard]",
    "python-multipart",
    "jinja2",
    "pypinyin",
    "opencc-python-reimplemented",
]

[project.scripts]
xsf = "xsf.cli:main"
xsf-mcp = "xsf.mcp_adapter:main"

[project.optional-dependencies]
mcp = ["mcp>=1.2"]
desktop = ["pystray", "Pillow"]
build = ["pyinstaller>=6.3"]

[tool.setuptools.packages.find]
include = ["xsf*"]

[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"
