[project]
name = "jiage"
version = "0.1.0"
description = "架阁 — 文献池检索系统"
requires-python = ">=3.11"
dependencies = [
    "PyMuPDF",
    "jieba",
    "requests",
    "fastapi",
    "uvicorn[standard]",
    "python-multipart",
    "jinja2",
    "pypinyin",
    "opencc-python-reimplemented",
]

[project.scripts]
jiage = "jiage.cli:main"

[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"
